<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- A fence around this page: it may load code, styles and pictures only from its own folder
     (plus OpenStreetMap map pictures), and may talk only to the database and the OpenStreetMap
     place search. If the database address (API, further down) ever changes, change it here too. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src https://xtrgefkopnqgektrllra.supabase.co https://nominatim.openstreetmap.org; base-uri 'none'; form-action 'none'">
<!-- Refuse to be shown inside another website's frame (a trick used to make people click hidden buttons).
     The page stays invisible until this check has passed. -->
<style id="noFrame">html{display:none !important}</style>
<script>
if (self === top) document.getElementById("noFrame").remove();
else { try { top.location = self.location.href; } catch (e) { /* cannot break out: stay invisible */ } }
</script>
<script>
/* LIGHT OR DARK, decided here, before anything is drawn (so the page never flashes the wrong one).
   1. If this device chose one with the sun / moon button, use that choice.
   2. Otherwise the page chooses by itself (themeAuto, below):
        07:00 to 19:00 Malaysian time  -> light. The page is read outdoors, at an entrance, in sunlight,
                                          where a dark page cannot be read.
        at night                       -> whatever the device prefers.
   To go back to "always follow the device", delete the one line that starts with: if (hour >= 7
   The colours themselves are in the <style> block below. The button is drawn by menu.js. */
window.themeAuto = function () {
  var hour = 12;
  try { hour = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kuala_Lumpur", hour: "2-digit", hourCycle: "h23" }).format(new Date())); } catch (e) { /* very old browser: treat it as daytime */ }
  if (hour >= 7 && hour < 19) return "light";
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
};
(function () {
  var chosen = null;
  try { chosen = localStorage.getItem("theme"); } catch (e) { /* storage blocked: the page chooses by itself */ }
  document.documentElement.dataset.theme = chosen === "dark" || chosen === "light" ? chosen : themeAuto();
})();
</script>
<title>Attendance Admin</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- The look of the map in the event editor (third-party Leaflet, do not edit that file). -->
<link rel="stylesheet" href="leaflet.css">
<style>
/* ---------- colours: the same set as the staff page, plus a shadow ---------- */
:root{
  color-scheme:light;
  --bg:#f2f7f5; --card:#fff; --ink:#14302a; --mute:#566b64; --line:#c9d8d2;
  --brand:#0b5d4b; --on-brand:#fff;
  --ok:#0b6b3a;   --ok-bg:#e3f4ea;
  --bad:#a3231b;  --bad-bg:#fbe9e7;
  --warn:#7a5200; --warn-bg:#fff3d6;
  --shadow:0 1px 2px rgb(20 48 42 / .10), 0 8px 14px -6px rgb(20 48 42 / .30);
}
/* Dark is switched on by <html data-theme="dark">. The script at the top of <head> sets it before
   anything is drawn; the sun / moon button beside the menu (menu.js) changes it. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1a17; --card:#16251f; --ink:#e6f0ec; --mute:#9db3aa; --line:#2b3f37;
  --brand:#3fb594; --on-brand:#04251c;
  --ok:#7be0a8;   --ok-bg:#143325;
  --bad:#ff9d94;  --bad-bg:#3a1b18;
  --warn:#f0c46a; --warn-bg:#3a2d0c;
  --shadow:0 1px 2px rgb(0 0 0 / .40), 0 8px 14px -6px rgb(0 0 0 / .65);
}

/* ---------- page frame ---------- */
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  caret-color:var(--brand); accent-color:var(--brand);
}
::selection{background:var(--brand); color:var(--on-brand)}
.sr-only{position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
h1{margin:0; font-size:1.45rem; line-height:1.2; letter-spacing:-.01em}
h2{margin:0; font-size:1.1rem; line-height:1.25}
p{margin:0}
a{color:var(--brand); text-underline-offset:3px}
.mute{color:var(--mute)}
.small{font-size:.88rem}

/* ---------- top bar and tabs ---------- */
.bar{position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line)}
.bar-in,.tabs,main{max-width:1120px; margin-inline:auto}
.bar-in{display:flex; align-items:center; gap:12px; padding:10px 16px}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1}
.logo{flex:none; width:40px; height:40px; object-fit:contain}
.brand strong{display:block; line-height:1.2}
.brand span{display:block; color:var(--mute); font-size:.82rem; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lang{display:flex; flex:none; border:1.5px solid var(--line); border-radius:10px; overflow:hidden}
.lang button{font:inherit; font-size:.85rem; font-weight:700; letter-spacing:.03em; min-width:42px; min-height:38px; padding:0 .5rem; border:0; background:transparent; color:var(--mute); cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand); color:var(--on-brand)}
.tabs{display:flex; gap:2px; padding:0 8px; overflow-x:auto; scrollbar-width:none}
.tabs a{padding:.65rem .85rem; color:var(--mute); font-weight:600; text-decoration:none; white-space:nowrap; border-bottom:3px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--brand)}
main{padding:22px 16px 72px}
.view{display:grid; grid-template-columns:minmax(0,1fr); gap:18px}   /* minmax(0,…) lets wide tables scroll inside their box instead of stretching the page */
.head{display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:12px}
.head p{color:var(--mute); max-width:62ch}

/* ---------- buttons ---------- */
.btn{
  font:inherit; font-weight:600; min-height:44px; padding:.5rem .95rem;
  display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
  border:1.5px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); cursor:pointer;
}
a.btn{text-decoration:none}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.small{min-height:36px; padding:.25rem .7rem; font-size:.9rem}
.btn[disabled]{opacity:.6; cursor:progress}
.btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
:is(a,button,input,select,summary):focus-visible{outline:3px solid var(--brand); outline-offset:2px}

/* ---------- form controls ---------- */
label,.label{display:block; font-weight:600; font-size:.92rem; margin:0 0 .3rem}
input:not([type=checkbox]),select{
  width:100%; font:inherit; min-height:44px; padding:.5rem .7rem;
  border:1.5px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink);
}
select{text-overflow:ellipsis}
input:user-invalid,select:user-invalid{border-color:var(--bad)}
input.code{text-transform:uppercase}
.form{display:grid; gap:14px}
.row{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; align-items:start}
.help{margin:.3rem 0 0; color:var(--mute); font-size:.85rem}
.check{display:flex; align-items:center; gap:.55rem; min-height:44px; font-weight:600; margin:0; cursor:pointer}
.check input{width:20px; height:20px; flex:none}
.days{display:flex; flex-wrap:wrap; gap:6px}
.days label{position:relative; margin:0; cursor:pointer}
.days span{display:grid; place-items:center; min-width:46px; min-height:40px; padding:0 .5rem; border:1.5px solid var(--line); border-radius:10px; font-weight:600; font-size:.9rem; color:var(--mute)}
.days input:checked + span{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.days input:focus-visible + span{outline:3px solid var(--brand); outline-offset:2px}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.actions .push{margin-left:auto}
.tools{display:flex; flex-wrap:wrap; gap:10px; align-items:end}
.tools > div{min-width:150px; flex:1 1 150px}
.tools > .fixed{flex:0 1 auto; min-width:0; max-width:100%}

/* ---------- surfaces ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px}
.editor{border:1.5px solid var(--brand); border-radius:14px; padding:18px; background:var(--card)}
.note{padding:.7rem .9rem; border-radius:10px; border:1.5px solid; font-size:.93rem}
.note.warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
.note.info{border-color:var(--line); color:var(--mute)}
/* the tick list of staff in the event editor (a selected-staff event) */
.picklist{max-height:320px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:0 16px; padding:4px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg)}
.pick{font-weight:400; min-height:42px; min-width:0}
.pick span:last-child{min-width:0; overflow-wrap:anywhere}
.empty{padding:28px 18px; text-align:center; color:var(--mute)}
.pill{display:inline-block; padding:.08rem .55rem; border-radius:99px; font-size:.78rem; font-weight:700; border:1px solid; white-space:nowrap}
.pill.ok{color:var(--ok); background:var(--ok-bg); border-color:var(--ok)}
.pill.warn{color:var(--warn); background:var(--warn-bg); border-color:var(--warn)}
.pill.bad{color:var(--bad); background:var(--bad-bg); border-color:var(--bad)}
.pill.off{color:var(--mute); border-color:var(--line)}
.skeleton{display:grid; gap:10px; padding:18px}
.skeleton i{display:block; height:16px; border-radius:6px; background:var(--line); opacity:.6}
.skeleton i:nth-child(2){width:82%} .skeleton i:nth-child(3){width:64%}

/* ---------- tables ---------- */
.tablewrap{position:relative; overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--card)}
table{border-collapse:collapse; width:100%; font-size:.94rem; font-variant-numeric:tabular-nums}
th,td{padding:.6rem .85rem; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top}
th{font-size:.8rem; font-weight:600; color:var(--mute)}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal; min-width:18ch}
td.wide{min-width:30ch}
td.num,th.num{text-align:right}
td.end{text-align:right}
td.code{font-weight:600}
td.edit{padding:14px; white-space:normal; background:var(--bg)}
.hours td{vertical-align:middle}
.hours td.wrap{overflow-wrap:anywhere}
.hours .btn.small{margin-left:.15rem}
.fixnote{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px}
.fixnote + .fixnote{margin-top:6px}

/* ---------- segmented tabs inside a view ---------- */
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{font:inherit; font-weight:600; min-height:40px; padding:.3rem .85rem; border:1.5px solid var(--line); border-radius:99px; background:transparent; color:var(--mute); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}

/* ---------- login ---------- */
.login{max-width:420px; margin:6vh auto 0; display:grid; gap:18px}

/* ---------- QR screen ---------- */
.qr-layout{display:grid; grid-template-columns:minmax(0,1fr); gap:18px}
.qr-stage{display:grid; gap:14px; justify-items:center; text-align:center; padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--card)}
.qr-tile{width:min(100%, 440px); aspect-ratio:1; background:#fff; border-radius:12px; padding:10px; display:grid; place-items:center; color:#3c4a45}
.qr-tile svg{width:100%; height:100%; display:block}
.qr-name{font-size:1.25rem; font-weight:700; line-height:1.25; overflow-wrap:anywhere}
.qr-bar{width:min(100%, 440px); height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.qr-bar i{display:block; height:100%; width:100%; background:var(--brand); transform-origin:left}
.qr-count{font-size:1.05rem}
.qr-count b{font-size:1.5rem; font-variant-numeric:tabular-nums}
.qr-side{display:grid; gap:14px; align-content:start}
.qr-stage:fullscreen{align-content:center; border:0; border-radius:0; background:var(--bg); padding:3vmin; gap:2.2vmin}
.qr-stage:fullscreen .qr-tile{width:min(78vmin, 92vw)}
.qr-stage:fullscreen .qr-bar{width:min(78vmin, 92vw)}
.qr-stage:fullscreen .qr-name{font-size:clamp(1.4rem, 4vmin, 3rem)}
.qr-stage:fullscreen .qr-count{font-size:clamp(1.1rem, 2.6vmin, 2rem)}
@media (min-width:900px){
  .qr-layout{grid-template-columns:minmax(0,1fr) 340px; grid-template-rows:auto 1fr; grid-template-areas:"stage pick" "stage side"; align-items:start}
  .qr-pick{grid-area:pick} .qr-stage{grid-area:stage} .qr-side{grid-area:side}
}
@media (prefers-reduced-motion:no-preference){
  .qr-bar i.run{animation:shrink linear forwards}
  @keyframes shrink{from{transform:scaleX(1)} to{transform:scaleX(0)}}
}

.pair summary{cursor:pointer; font-weight:600; padding:.35rem 0; border-radius:6px}
.pair[open] summary{margin-bottom:.7rem}

/* ---------- the map in the event editor ---------- */
.map{position:relative; z-index:0; height:320px; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg)}
.map-pin{background:none; border:0}
.map-pin svg{width:30px; height:40px; display:block; filter:drop-shadow(0 2px 2px rgb(0 0 0 / .35))}
.map-results{display:grid; gap:6px}
.map-results .btn{justify-content:flex-start; text-align:left; font-weight:500; white-space:normal; height:auto}
@media (min-width:900px){ .map{height:380px} }

/* ---------- events list ---------- */
.list{display:grid; gap:10px}
.item{background:var(--card); border:1px solid var(--line); border-radius:14px}
.item-head{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:14px 16px}
.item-title{flex:1 1 220px; min-width:0}
.item-title strong{display:block; overflow-wrap:anywhere}
.item-body{border-top:1px solid var(--line); padding:16px; display:grid; gap:18px}
.windows{display:grid; gap:8px}
.window{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg)}
.window > div:first-child{flex:1 1 200px; min-width:0}

/* ---------- the floating notification (same as the staff page) ---------- */
.toast{
  position:fixed; z-index:10; inset:auto; top:max(12px, env(safe-area-inset-top)); left:12px; right:12px;
  margin:0; width:auto; height:auto; overflow:visible;
  display:grid; grid-template-columns:auto 1fr auto; gap:.7rem; align-items:start;
  padding:.8rem .35rem .8rem .9rem; border:1.5px solid; border-radius:14px; box-shadow:var(--shadow);
}
.toast svg{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.toast-icon{width:24px; height:24px; margin-top:.1rem}
.toast-body{min-width:0}
.toast-title{font-weight:700; line-height:1.3}
.toast-text{margin-top:.15rem; font-size:.95rem; overflow-wrap:anywhere}
.toast-close{width:44px; height:44px; margin:-.5rem 0; padding:0; display:grid; place-items:center; border:0; border-radius:10px; background:transparent; color:inherit; cursor:pointer}
.toast-close svg{width:18px; height:18px}
.toast-close:hover{background:color-mix(in srgb, currentColor 12%, transparent)}
.toast.ok{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.toast.bad{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.toast.warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
@media (min-width:640px){ .toast{top:24px; left:24px; right:auto; width:min(420px, calc(100vw - 48px))} }
@media (prefers-reduced-motion:no-preference){
  .toast{animation:drop .32s cubic-bezier(.16,1,.3,1)}
  @keyframes drop{from{opacity:0; transform:translateY(-14px) scale(.97)}}
}
@media (max-width:520px){ .brand span{display:none} }

/* ---------- phone: a table becomes a list of small blocks, one per row ---------- */
@media (max-width:640px){
  .stack thead{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}
  .stack,.stack tbody,.stack tr,.stack td{display:block}
  .stack tr{padding:.65rem .85rem; border-bottom:1px solid var(--line)}
  .stack tbody tr:last-child{border-bottom:0}
  .stack td{padding:0; border:0; white-space:normal; text-align:left; min-width:0}
  .stack td.inline{display:inline; margin-right:.45rem}
  .stack td[data-label]::before{content:attr(data-label) ": "; color:var(--mute); font-size:.85rem}
  .stack td.nil{display:none}
  .stack tr.editing{padding:14px; background:var(--bg)}
  .stack td.edit{padding:0; background:transparent}
  .stack.staff tr:not(.editing){display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"code status" "name act" "type act"; gap:2px 12px; align-items:center}
  .stack.staff td.code{grid-area:code} .stack.staff td.name{grid-area:name}
  .stack.staff td.type{grid-area:type; color:var(--mute); font-size:.88rem}
  .stack.staff td.status{grid-area:status; justify-self:end} .stack.staff td.act{grid-area:act; justify-self:end}
}
</style>
</head>
<body>

<header class="bar">
 <div class="bar-in">
  <div class="brand">
   <img class="logo" src="logo.png" alt="" width="40" height="40" onerror="this.remove()">
   <div>
    <strong data-t="appName"></strong>
    <span>Sek. Ren. Islam Al-Irsyad Balok</span>
   </div>
  </div>
  <div class="lang" role="group" aria-label="Language / Bahasa">
   <button type="button" data-lang="en" aria-pressed="true"  lang="en" title="English">EN</button>
   <button type="button" data-lang="ms" aria-pressed="false" lang="ms" title="Bahasa Melayu">BM</button>
  </div>
  <!-- Spare sign-out button. Only used if menu.js is missing; normally Sign out lives in the menu. -->
  <button class="btn small" id="logoutOld" type="button" data-t="logout" hidden></button>
  <!-- The three-line menu with links to every page. Its list of pages lives in menu.js. -->
  <div id="menu"></div>
 </div>
 <nav class="tabs" id="tabs" aria-label="Admin" hidden>
  <a href="#qr" data-t="tabQr"></a>
  <a href="#log" data-t="tabLog"></a>
  <a href="#events" data-t="tabEvents"></a>
  <a href="#staff" data-t="tabStaff"></a>
  <a href="#settings" data-t="tabSettings"></a>
 </nav>
</header>

<main>
 <!-- Login. Shown until an admin has signed in. -->
 <section class="login" id="view-login" hidden>
  <div>
   <h1 data-t="loginTitle"></h1>
   <p class="mute" data-t="loginHelp" style="margin-top:.4rem"></p>
  </div>
  <form class="card form" id="loginForm" novalidate>
   <div>
    <label for="email" data-t="email"></label>
    <input id="email" name="email" type="email" autocomplete="username" required spellcheck="false">
   </div>
   <div>
    <label for="password" data-t="password"></label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
   </div>
   <button class="btn primary" id="loginGo" type="submit" data-t="signIn"></button>
  </form>
  <p class="small" id="backLink" hidden><a href="./" data-t="backToStaff"></a></p>
 </section>

 <!-- The five screens. Their contents are drawn by the script. -->
 <section class="view" id="view-qr" hidden></section>
 <section class="view" id="view-log" hidden></section>
 <section class="view" id="view-events" hidden></section>
 <section class="view" id="view-staff" hidden></section>
 <section class="view" id="view-settings" hidden></section>
</main>

<!-- The floating notification -->
<div class="toast" id="toast" hidden>
 <svg class="toast-icon" id="toastIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
 <div class="toast-body"><p class="toast-title" id="toastTitle"></p><p class="toast-text" id="toastText"></p></div>
 <button class="toast-close" id="toastClose" type="button">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
 </button>
</div>
<p class="sr-only" id="announce" role="status" aria-live="polite"></p>

<!-- Third-party QR drawing library (MIT licence). Do not edit that file. -->
<script src="qrcode.js"></script>
<!-- Third-party map library, Leaflet (BSD licence). Do not edit that file. If it is missing, the event editor simply has no map. -->
<script src="leaflet.js"></script>
<script src="menu.js"></script>
<script>
/* =====================================================================
   ADMIN PAGE  v3.2 (v2 + English by default, three-line menu, map in the event editor, sign-out after 15 quiet minutes;
                     3.1: sign-out still reaches the server when the tab closes straight after;
                     3.2: fixes from the security review of 3 Oct 2026 - sign-out empties the page and ends
                          only this device's session, the attendance list loads every row and shows a clear
                          error instead of "0 present", staff and events are re-read while the page is open;
                     3.3: the QR screen counter follows the session, the same number as the display page.
                          Needs SQL file 07; with an older database it counts the whole day as before;
                     3.4: a session can have a "late after" time (Events > hours); the attendance list and
                          the CSV show who was late and by how many minutes. Needs SQL file 09: with an
                          older database the list still loads, only without the late column.
                          The staff list can be narrowed by type (staff / intern or contract);
                     3.5: a session can be marked check-in or check-out (Events > hours). The Attendance
                          screen then has an Hours list: time in, time out, the actual length and the
                          length inside working hours. An owner or manager can add a missing time by
                          hand, with a reason; it is always shown as manual. Needs SQL file 10: with an
                          older database the Hours list simply does not appear;
                     3.6: light or dark is chosen at the top of <head> (light from 07:00 to 19:00 Malaysian
                          time unless this device chose), and a sun / moon button sits beside the menu
                          (drawn by menu.js). Nothing else changed;

/* ---------- 3. Small helpers ------------------------------------------ */
const $ = selector => document.querySelector(selector);

/* Swap {name} style placeholders for real values. */
const fill = (template, values) => String(template).replace(/\{(\w+)\}/g, (_, key) => (values && key in values ? values[key] : ""));

/* t("save") gives the word in the current language. */
const t = (key, values) => fill(TEXT[state.lang][key] ?? key, values);

/* Build a piece of the page safely. Text is always added as text, never as HTML,
   so a staff or event name can never turn into code.
   h("button", {class:"btn", onclick: fn}, "Save")                                    */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  const later = {};
  for (const [name, value] of Object.entries(props || {})) {
    if (value === false || value == null) continue;
    if (name === "class") el.className = value;
    else if (name === "value" || name === "checked") later[name] = value;        // set after children exist
    else if (name.startsWith("on")) el.addEventListener(name.slice(2), value);
    else el.setAttribute(name, value === true ? "" : value);
  }
  for (const child of children.flat(Infinity)) if (child != null && child !== false) el.append(child);
  for (const [name, value] of Object.entries(later)) el[name] = value;
  return el;
}

/* Put new content into one of the five screens. Empty slots (false / null) are skipped. */
function fillView(name, ...parts) {
  if (!state.session) return;                          // signed out: the screens stay empty
  $("#view-" + name).replaceChildren(...parts.flat(Infinity).filter(part => part != null && part !== false));
}

/* Browser storage can be blocked, so never let it crash the page.
   store("local", key)            read          "local"   = kept on this device (language)
   store("session", key, value)   write         "session" = kept for this tab only (the sign-in)
   store("session", key, null)    remove
   When the browser blocks storage, even looking at it throws an error, so that happens inside the
   "try". The page then remembers things in its own memory instead: everything works, but a reload
   asks for the password again.                                                                    */
const memory = { local: {}, session: {} };
function store(where, key, value) {
  try {
    const area = where === "session" ? window.sessionStorage : window.localStorage;
    if (value === undefined) return area.getItem(key);
    if (value === null) area.removeItem(key); else area.setItem(key, value);
    return null;
  } catch { /* storage unavailable: use the page's own memory below */ }
  const box = memory[where === "session" ? "session" : "local"];
  if (value === undefined) return key in box ? box[key] : null;
  if (value === null) delete box[key]; else box[key] = String(value);
  return null;
}

/* ---------- 5. The floating notification ------------------------------ */
const toastEl = $("#toast");
const canLift = "popover" in HTMLElement.prototype;
if (canLift) toastEl.popover = "manual";
let toastTimer = null;

function toast(kind, title, text) {
  clearTimeout(toastTimer);
  toastEl.className = "toast " + kind;
  $("#toastIcon").innerHTML = ICON[kind];
  $("#toastTitle").textContent = title;
  $("#toastText").textContent = text || "";
  $("#toastText").hidden = !text;
  $("#toastClose").setAttribute("aria-label", t("close"));
  $("#announce").textContent = title + (text ? ". " + text : "");
  if (toastEl.hidden) { toastEl.hidden = false; if (canLift) toastEl.showPopover(); }
  else { toastEl.style.animation = "none"; void toastEl.offsetWidth; toastEl.style.animation = ""; }
  if (kind === "ok") toastTimer = setTimeout(hideToast, text ? 7000 : 4000);   // good news leaves by itself; problems stay
}
function hideToast() {
  clearTimeout(toastTimer);
  if (canLift && toastEl.matches(":popover-open")) toastEl.hidePopover();
  toastEl.hidden = true;
  $("#announce").textContent = "";
}
const fail = error => {
  if (error && error.kind === "session" && !state.session) return;      // already signed out: the login screen says enough
  toast("bad", t("errTitle"), explain(error));
};

/* Turn a technical error into a sentence a person can act on. */
function explain(error) {
  if (!error) return t("errUnknown", { code: "?" });
  if (error.text) return error.text;
  if (error.kind === "network") return t("errNetwork");
  if (error.kind === "session") return t("errSession");
  // P0001: the database refused on purpose and gave a short reason word (for example "fix_future").
  if (error.code === "P0001" && TEXT[state.lang]["db_" + error.message]) return t("db_" + error.message);
  switch (error.code) {
    case "PGRST204": case "42703": return t("errNeedsSql");      // "no such column": the page is newer than the database
    case "23503": return t("errInUse");
    case "23505": return t("errDuplicate");
    case "23514": return t("errCheck");
    case "42501": return t("errNotAllowed");
  }
  return t("errUnknown", { code: error.code || error.status || "?" });
}


/* ---------- 6. Signing in and staying signed in -----------------------
   The password is sent straight to Supabase and is never kept.
   What is kept is a short-lived token, in this browser tab only:
   closing the tab signs you out.                                       */
let refreshTimer = null;
let renewing = null;             // the renewal that is under way, if any. Everyone who needs one waits for the same one.

function setSession(session) {
  state.session = session;
  store("session", "admin_session", session ? JSON.stringify(session) : null);
  clearTimeout(refreshTimer);
  if (session) {
    const wait = Math.max(5000, session.expires_at * 1000 - Date.now() - 90000);     // renew 90 s before it runs out
    refreshTimer = setTimeout(renewSession, Math.min(wait, 2 ** 31 - 1));
  }
}

async function authCall(grant, body) {
  let response;
  try {
    response = await fetch(API + "/auth/v1/token?grant_type=" + grant, {
      method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
  } catch { throw { kind: "network" }; }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw { kind: "auth", status: response.status };
  return {
    access_token: data.access_token, refresh_token: data.refresh_token,
    expires_at: data.expires_at || Math.floor(Date.now() / 1000) + (data.expires_in || 3600),

/* Tell the server that a token is finished with. "scope=local" ends THIS device's session only:
   signing out on a phone must not sign out the laptop that is showing the QR.
   keepalive: the browser finishes this request even if the tab is closed a moment later. */
function serverSignOut(token) {
  if (token) fetch(API + "/auth/v1/logout?scope=local", { method: "POST", keepalive: true, headers: { apikey: KEY, Authorization: "Bearer " + token } }).catch(() => {});
}

/* Returns "ok", "offline" (try again later) or "ended" (must sign in again).
   Only ONE renewal runs at a time. Two at once would use the same renewal token twice,
   which the server treats as theft and answers by ending the session. */
function renewSession() {
  if (!state.session) return Promise.resolve("ended");
  if (!renewing) renewing = renewNow().finally(() => { renewing = null; });
  return renewing;
}
async function renewNow() {
  const epoch = state.epoch;
  let fresh;
  try { fresh = await authCall("refresh_token", { refresh_token: state.session.refresh_token }); }
  catch (error) {
    if (epoch !== state.epoch) return "ended";                              // signed out while we waited
    // Only a clear "no" from the server (400, 401, 403) ends the session. A server hiccup (500, 503),
    // "too many requests" (429) or no internet means: keep the session and try again shortly.
    const refused = error.kind === "auth" && [400, 401, 403].includes(error.status);
    if (!refused) { clearTimeout(refreshTimer); refreshTimer = setTimeout(renewSession, 30000); return "offline"; }
    endSession("errSession"); return "ended";
  }
  if (epoch !== state.epoch) { serverSignOut(fresh.access_token); return "ended"; }   // the person signed out while this was on its way: do NOT sign them back in
  setSession(fresh); return "ok";
}

/* Forget the sign-in on this device and on the server, without touching the page. */
function dropSession() {
  serverSignOut(state.session && state.session.access_token);
  state.epoch++;
  setSession(null);
}

/* Sign out: forget the session AND empty the page. Hiding the screens is not enough: the staff list,
   attendance and admin emails would still be in the page for anyone who knows where to look. */
function endSession(messageKey, values) {

  stopQr(); clearTimeout(state.log.timer); closeMap();
  Object.assign(state, { role: null, staff: [], events: [], windows: [], settings: null, invited: null, basicsAt: 0, openNow: {},
                         edit: null, confirm: null, displays: [], canPair: false, pairOpen: false, admins: [], activity: null });
  Object.assign(state.log, { eventId: "", windowId: "", tab: "present", rows: [], hours: [], exits: [], capped: false, loadedAt: null, loading: false,
                             error: null, stale: false, loadedKey: "", shown: LOG_SHOW, known: { date: "", events: new Set(), sessions: new Set() } });
  state.log.ticket++;                                                       // any attendance list still on its way is now out of date
  state.staffFilter.text = ""; state.evFilter.text = "";

/* ---------- 6b. Signing out after a quiet spell ---------------------------
   If nobody touches the page for IDLE_MINUTES, it signs out by itself, on every
   screen including the QR screen. One minute before, it gives a warning.
   For a long event, use the display page: it has no login to lose.          */
const IDLE_MS = IDLE_MINUTES * 60000;
let lastActive = Date.now(), lastSaved = 0, idleWarned = false;

function noteActivity() {
  const now = Date.now();
  // The limit had already passed (for example the laptop was asleep and its timers with it):
  // this touch must sign out, not rescue the session.
  if (state.session && now - lastActive >= IDLE_MS) { checkIdle(); return; }
  lastActive = now;
  if (idleWarned) { idleWarned = false; if ($("#toastTitle").textContent === t("idleSoon")) hideToast(); }   // take the warning away, but no other message
  if (lastActive - lastSaved > 5000) { lastSaved = lastActive; store("session", "admin_active", String(lastActive)); }
}
/* A fresh sign-in starts a fresh quiet spell. */
function restartIdle() {
  lastActive = lastSaved = Date.now(); idleWarned = false;
  store("session", "admin_active", String(lastActive));
}
function checkIdle() {
  if (!state.session) return;
  const quiet = Date.now() - lastActive;
  if (quiet >= IDLE_MS) { idleWarned = false; endSession("errIdle", { n: IDLE_MINUTES }); }
  else if (quiet >= IDLE_MS - 60000 && !idleWarned) { idleWarned = true; toast("warn", t("idleSoon"), t("idleSoonText")); }
}
["pointerdown", "pointermove", "keydown", "wheel", "touchstart"].forEach(name =>
  document.addEventListener(name, noteActivity, { passive: true, capture: true }));
setInterval(checkIdle, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkIdle(); });   // a laptop that slept wakes up here

/* ---------- 7. Talking to the database --------------------------------
   api("staff?select=*")                              read
   api("staff", {method:"POST", body:{...}})          add
   api("staff?id=eq.123", {method:"PATCH", body})     change
   api("staff?id=eq.123", {method:"DELETE"})          remove
   Every call carries the signed-in token. The database decides.        */
async function api(path, { method = "GET", body, count } = {}) {
  if (!state.session) throw { kind: "session" };
  const epoch = state.epoch;
  // "gone": the person signed out (or was signed out) while this request was on its way.
  // Its reply must never be written back into the page.
  const gone = () => epoch !== state.epoch || !state.session;
  const send = () => fetch(API + "/rest/v1/" + path, {
    method,
    headers: { apikey: KEY, Authorization: "Bearer " + state.session.access_token,
               "Content-Type": "application/json", Prefer: "return=representation" + (count ? ",count=exact" : "") },
    body: body === undefined ? undefined : JSON.stringify(body),
    signal: AbortSignal.timeout ? AbortSignal.timeout(20000) : undefined
  });
  let response, raw;
  try { response = await send(); } catch { throw { kind: gone() ? "session" : "network" }; }
  if (gone()) throw { kind: "session" };
  if (response.status === 401) {                       // token ran out: renew once and try again
    const renewed = await renewSession();
    if (gone() || renewed === "ended") throw { kind: "session" };
    if (renewed === "offline") throw { kind: "network" };
    try { response = await send(); } catch { throw { kind: gone() ? "session" : "network" }; }
  }
  try { raw = await response.text(); } catch { throw { kind: gone() ? "session" : "network" }; }
  if (gone()) throw { kind: "session" };
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch { /* not JSON */ }
  if (!response.ok) throw { kind: "db", status: response.status, code: data && data.code, message: data && data.message };
  if ((method === "PATCH" || method === "DELETE") && Array.isArray(data) && data.length === 0) throw { kind: "db", code: "42501" };
  // With count: the database also says how many rows match in all ("Content-Range: 0-999/2345").
  const total = count ? Number((response.headers.get("Content-Range") || "").split("/")[1]) : NaN;
  return { data, total: Number.isFinite(total) ? total : null };
}

async function qrTick() {
  clearTimeout(state.qr.timer); state.qr.timer = null;
  const ev = eventById(state.qr.eventId);
  if (!ev || state.view !== "qr" || !state.session) return;
  if (document.hidden) return;                                   // nobody is looking: stop. It restarts when the tab is shown again.
  const run = ++state.qr.run;                                    // a ticket number: if it changes while we wait, someone else took over
  state.qr.busy = true;
  let next = QR_ROTATE_MS;
  try {
    const { data } = await api("rpc/issue_qr_token", { method: "POST", body: { p_event_code: ev.event_code } });
    if (run !== state.qr.run) return;
    const lifetime = ((state.settings && state.settings.qr_valid_seconds) || 60) * 1000;
    const left = data.valid_seconds > 0 ? data.valid_seconds * 1000 : lifetime;   // how long THIS token is still accepted (older databases do not say: assume a full life)
    state.qr.token = data.token; state.qr.goodUntil = Date.now() + left; state.qr.lost = false;
    next = Math.min(QR_ROTATE_MS, lifetime / 2, Math.max(2000, left - 3000));
    keepAwake();
    qrExtras(ev, run);                                            // count and open/closed, without holding up the QR
    refreshBasics();                                              // a QR screen left open still learns about new staff and events
  } catch (error) {
    if (run !== state.qr.run) return;
    if (error.kind === "session") { state.qr.busy = false; return; }
    state.qr.lost = true; next = 5000;
    if (Date.now() > state.qr.goodUntil) state.qr.token = null;   // never leave a dead code on screen
  }
  state.qr.busy = false;
  paintQr(next);
  state.qr.timer = setTimeout(qrTick, next);
}

async function qrExtras(ev, run) {
  try {
    // The count comes from the database (event_counter, SQL file 07), which also says WHICH session it counted.
    // The display page gets its number from the same place, so the two screens always agree.
    const [counter, open] = await Promise.all([
      api("rpc/event_counter", { method: "POST", body: { p_event_code: ev.event_code } })
        .catch(error => { if (error.status !== 404) throw error; return null; }),      // 404: SQL file 07 has not been run yet
      api("rpc/list_events", { method: "POST", body: {} })
    ]);
    if (run !== state.qr.run) return;
    if (counter && counter.data) {
      state.qr.present = counter.data.present;
      state.qr.session = counter.data.window_label ? { label: counter.data.window_label, state: counter.data.window_state } : null;
    } else {                                                                           // older database: count the whole day, as before
      const present = await api(`attendance?select=staff_id&event_id=eq.${ev.id}&attendance_date=eq.${todayKL()}&status=eq.present`);
      if (run !== state.qr.run) return;
      state.qr.present = new Set(present.data.map(r => r.staff_id)).size; state.qr.session = null;
    }
    state.openNow = Object.fromEntries(open.data.map(e => [e.event_code, e.open_now]));
    paintQr();
  } catch { /* the QR itself still works */ }
}

/* Draw the current token as a QR picture, and the notes beside it. */
function paintQr(restartBarMs) {
  const ev = eventById(state.qr.eventId);
  const tile = $("#qrTile");
  if (!ev || !tile) return;
  if (state.qr.token) {
    const qr = qrcode(0, "M");
    // The token goes after "#". That part of a link stays in the phone: it is never sent to a web server,
    // so it cannot end up in a server log. The staff page reads it and then wipes it from the address bar.
    qr.addData(STAFF_PAGE + "?e=" + encodeURIComponent(ev.event_code) + "#t=" + encodeURIComponent(state.qr.token));
    qr.make();
    const n = qr.getModuleCount(), quiet = 4;
    let path = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) path += `M${c + quiet} ${r + quiet}h1v1h-1z`;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${n + quiet * 2} ${n + quiet * 2}`); svg.setAttribute("shape-rendering", "crispEdges");
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "QR: " + ev.name);
    svg.innerHTML = `<path d="${path}" fill="#000"/>`;
    tile.replaceChildren(svg);
  } else {
    tile.replaceChildren(state.qr.lost ? t("qrLost") : t("loading"));
  }
  if (restartBarMs) {
    const bar = $("#qrBar");
    bar.className = ""; void bar.offsetWidth;
    bar.style.animationDuration = restartBarMs + "ms"; bar.className = "run";
  }
  const total = state.staff.filter(s => s.active).length;
  // "Petang: 4 of 70 submitted", or "Pagi (closed): 5 of 70 submitted" between sessions. No session known: the old whole-day line.
  const session = state.qr.session;
  const sessionNote = !session ? "" : session.state === "closed" ? t("qrWinClosed") : session.state === "upcoming" ? t("qrWinUpcoming") : "";
  $("#qrCount").replaceChildren(...(state.qr.present == null ? []
    : session ? [session.label + (sessionNote ? " (" + sessionNote + ")" : "") + ": ", h("b", null, String(state.qr.present)), " " + t("qrCounted", { n: total })]
    : [h("b", null, String(state.qr.present)), " " + t("qrPresent") + " " + t("qrOf", { n: total })]));
  const notes = [];
  if (state.qr.lost) notes.push(h("p", { class: "note warn" }, t("qrLost")));
  if (!ev.require_qr) notes.push(h("p", { class: "note warn" }, t("qrOptionalNote")));
  if (state.openNow[ev.event_code] === false) notes.push(h("p", { class: "note warn" }, t("qrClosedNote")));
  $("#qrNotes").replaceChildren(...notes);
}

function stopQr() {
  clearTimeout(state.qr.timer); state.qr.timer = null; state.qr.token = null; state.qr.present = null; state.qr.session = null; state.qr.lost = false;
  state.qr.run++; state.qr.busy = false;                          // anything still waiting for the database is now out of date
  if (state.qr.lock) { state.qr.lock.release().catch(() => {}); state.qr.lock = null; }
}

/* Ask the device not to dim or sleep while the QR is showing. Not every browser can. */
async function keepAwake() {
  if (state.qr.lock || !("wakeLock" in navigator)) return;
  try { state.qr.lock = await navigator.wakeLock.request("screen"); state.qr.lock.addEventListener("release", () => { state.qr.lock = null; }); }
  catch { /* the screen may sleep; nothing else breaks */ }
}

function toggleFullscreen() {
  const stage = $("#qrStage");
  if (document.fullscreenElement) document.exitFullscreen();
  else if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !state.session) return;
  if (state.view === "qr" && state.qr.eventId && !state.qr.timer && !state.qr.busy) qrTick();

/* ---------- 10. Attendance screen -------------------------------------- */
function openLog() { drawLog(); loadLog(); }

/* Read EVERY row that matches, 1,000 at a time. (The database never hands out more than 1,000 rows
   in one go. Before, the page stopped at the first 1,000, so on a busy or spammed day real check-ins
   could be missing from the screen and from the CSV.) */
async function fetchAllRows(query) {
  const rows = [];
  for (let page = 0; page < LOG_MAX_PAGES; page++) {
    const { data, total } = await api(query + "&limit=" + LOG_PAGE + "&offset=" + rows.length, { count: true });
    rows.push(...data);
    const done = total != null ? rows.length >= total : data.length < LOG_PAGE;     // total = how many the database says there are
    if (done || !data.length) return { rows, capped: false };
  }
  return { rows, capped: true };
}

async function loadLog(quiet) {
  const L = state.log;
  clearTimeout(L.timer);
  if (L.followToday && L.date !== todayKL()) { L.date = todayKL(); L.rows = []; quiet = false; }   // midnight has passed: move on to the new day
  const again = () => { if (state.view === "log" && L.followToday) L.timer = setTimeout(() => loadLog(true), LOG_REFRESH_MS); };
  if (quiet && document.hidden) { again(); return; }             // tab not visible: skip this round
  if (quiet && L.loading) return;                                // a load the person asked for is under way: it will book the next round itself
  const ticket = ++L.ticket, date = L.date, eventId = L.eventId; // take a number. If a newer load starts while we wait, this one is thrown away.
  const key = date + "|" + eventId;
  if (!quiet) { L.loading = true; L.error = null; drawLog(); }
  try {
    // The event filter is applied by the database, so one event's rows can never push another's off the list.
    // Present and rejected are read separately for the same reason: a flood of rejected attempts cannot hide a real check-in.
    const read = withLate => {
      const base = "attendance?select=id,checked_in_at,status,reason,distance_m,gps_accuracy_m,device_id,staff_id,event_id,window_id" + (withLate ? ",late_minutes" : "") + (L.noListed ? "" : ",not_listed")
        + "&attendance_date=eq." + date + (eventId ? "&event_id=eq." + eventId : "") + "&order=checked_in_at.asc,id.asc";
      return Promise.all([fetchAllRows(base + "&status=eq.present"), fetchAllRows(base + "&status=eq.rejected")]);
    };
    let present, rejected;
    try {
      try { [present, rejected] = await read(!L.noLate); }
      catch (error) {
        // 42703 = "no such column". The newest one first: SQL file 12 (not_listed) has not been run yet. Read without it, and stop asking.
        if (L.noListed || error.kind !== "db" || error.code !== "42703") throw error;
        L.noListed = true;
        [present, rejected] = await read(!L.noLate);
      }
    }
    catch (error) {
      // 42703 = "no such column": SQL file 09 has not been run yet. Read the list without it, and stop asking.
      if (L.noLate || error.kind !== "db" || error.code !== "42703") throw error;
      L.noLate = true;
      [present, rejected] = await read(false);
    }
    // Hours: only for an event whose sessions are marked check-in / check-out. The pairing and the sums are done
    // by the database (the work_hours view); the page only shows them.
    let hours = [];
    if (hoursOn(eventId)) {
      try { hours = (await fetchAllRows("work_hours?select=" + HOURS_FIELDS + "&work_date=eq." + date + "&event_id=eq." + eventId + "&order=staff_id.asc")).rows; }
      catch (error) {
        // "No such view": SQL file 10 has not been run yet. Carry on without the Hours list, and stop asking.
        if (error.kind !== "db" || !(error.status === 404 || error.code === "42P01" || error.code === "PGRST205")) throw error;
        L.noHours = true;
      }
    }
    // Check-ins that the phone itself stopped: it had no position to send (location blocked, switched off, GPS did not
    // answer), so check_in() never saw them. They are kept in their own table and join the Rejected list here.
    let stuck = { rows: [], capped: false };
    if (!L.noProblems) {
      try { stuck = await fetchAllRows("location_problems?select=id,at,kind,device_id,staff_id,event_id&problem_date=eq." + date + (eventId ? "&event_id=eq." + eventId : "") + "&order=at.asc,id.asc"); }
      catch (error) {
        // "No such table": SQL file 11 has not been run yet. Carry on without them, and stop asking.
        if (error.kind !== "db" || !(error.status === 404 || error.code === "42P01" || error.code === "PGRST205")) throw error;
        L.noProblems = true;
      }
    }
    // Step-outs during working hours (SQL file 13). Every sum and mark comes from the work_exit_log view.
    let exits = { rows: [], capped: false };
    if (!L.noExits) {                                            // read even when no event allows it now: an old date may have some
      try { exits = await fetchAllRows("work_exit_log?select=" + EXIT_FIELDS + "&exit_date=eq." + date + (eventId ? "&event_id=eq." + eventId : "") + "&order=out_at.asc,id.asc"); }
      catch (error) {
        // "No such view": SQL file 13 has not been run yet. Carry on without the list, and stop asking.
        if (error.kind !== "db" || !(error.status === 404 || error.code === "42P01" || error.code === "PGRST205")) throw error;
        L.noExits = true;
      }
    }
    if (ticket !== L.ticket) return;                             // a newer load (another date, another event) has taken over
    // Dressed as a rejected row, so the list, the count and the CSV treat it like one. It has no session, distance or accuracy.
    const fromPhone = stuck.rows.map(p => ({ id: "p" + p.id, checked_in_at: p.at, status: "rejected", reason: "phone_" + p.kind, phone: true,
      distance_m: null, gps_accuracy_m: null, device_id: p.device_id || "", staff_id: p.staff_id, event_id: p.event_id, window_id: null }));
    L.rows = [...present.rows, ...rejected.rows, ...fromPhone]; L.capped = present.capped || rejected.capped || stuck.capped || exits.capped; L.hours = hours; L.exits = exits.rows;
    L.loadedAt = new Date(); L.loadedKey = key; L.error = null; L.stale = false;
    if (L.known.date !== date) L.known = { date, events: new Set(), sessions: new Set() };
    for (const r of L.rows) { L.known.events.add(r.event_id); if (r.window_id) L.known.sessions.add(r.window_id); }
  } catch (error) {
    if (ticket !== L.ticket) return;
    L.loading = false;
    if (error.kind === "session") return;
    if (quiet && L.loadedKey === key && !L.error) L.stale = true; // background refresh failed: keep the last good list for this date and event, but say that it is old
    else { L.error = error; L.rows = []; L.hours = []; L.exits = []; L.capped = false; }     // anything else failed: say so. Never show an empty list as if nobody came.
  }
  L.loading = false;
  if (state.view !== "log") return;
  // Do not yank a date picker or dropdown away from the person using it, and never redraw under an open "manual time" form.
  if (!(quiet && (busyChoosing() || (state.edit && (state.edit.kind === "fix" || state.edit.kind === "xfix"))))) drawLog();
  again();
  if (quiet) refreshBasics();                                    // names of staff added since sign-in
}

/* Work out the three lists from the rows we loaded. */
function logLists() {
  const L = state.log;
  // A check-in stopped on the phone (r.phone) has no session: it stays on the list whichever session is chosen.
  const chosen = r => (!L.eventId || r.event_id === L.eventId) && (!L.windowId || r.window_id === L.windowId || r.phone);
  const present  = L.rows.filter(r => r.status === "present" && chosen(r));
  const rejected = L.rows.filter(r => r.status === "rejected" && chosen(r))
    .sort((a, b) => Date.parse(a.checked_in_at) - Date.parse(b.checked_in_at));          // the two kinds of rejected row, in time order
  const here = new Set(present.map(r => r.staff_id));
  // An event for selected staff: only the people on its list can be "not checked in".
  const list = forSelected(eventById(L.eventId)) ? invitedOf(L.eventId) : null;
  const absent = L.eventId ? state.staff.filter(s => s.active && !here.has(s.id) && (!list || list.has(s.id))) : null;
  // Hours: days with a missing half come first (they are the ones that need attention), then by name.
  const hours = hoursOn(L.eventId) ? [...L.hours].sort((a, b) => (a.status === "complete") - (b.status === "complete") || (a.full_name || "").localeCompare(b.full_name || "")) : null;
  const exits = exitsOn(L.eventId) ? L.exits : null;
  return { present, rejected, absent, hours, exits };
}

/* Is there a Step-outs list? When the event on screen allows stepping out (for "All events": any event does),
   or when the date on screen has step-outs anyway (the switch may have been turned off since). */
const exitsOn = eventId => !state.log.noExits && (state.log.exits.length > 0
  || (eventId ? !!(eventById(eventId) || {}).allow_exit : state.events.some(e => e.allow_exit)));
const EXIT_FIELDS = "id,event_id,staff_id,staff_code,full_name,out_at,reason,going_home,planned_back,back_at,back_source,back_note,"
                  + "back_entered_by_email,minutes_away,late_minutes,day_minutes,over_limit,status";

/* Does this event pair a check-in session with a check-out session? Only then is there an Hours list.
   (Archived sessions count too, so an old date still shows its hours.) */
const hoursOn = eventId => !!eventId && !state.log.noHours && state.windows.some(w => w.event_id === eventId && w.counts_as);
const HOURS_FIELDS = "staff_id,staff_code,full_name,status,time_in,in_source,time_out,out_source,minutes_actual,minutes_official,late_minutes,"
                   + "official_start,official_end,in_note,in_entered_by,in_correction_id,out_note,out_entered_by,out_correction_id";
const shortKL  = iso => iso ? clockKL(iso).slice(0, 5) : "";                                        // 07:29 (the sums ignore seconds, so the screen does too)
const duration = minutes => minutes == null ? "" : t("hrsMin", { h: Math.floor(minutes / 60), m: String(minutes % 60).padStart(2, "0") });   // 8 h 04 min
const sourceText = source => source ? t(source === "manual" ? "srcManual" : source === "exit" ? "srcExit" : "srcRecorded") : "";
/* The reason and the account behind each manual time on a line, as plain text. */
const fixNotes = r => ["in", "out"].filter(half => r[half + "_source"] === "manual")
  .map(half => t("fixNote", { half: t(half === "in" ? "fixIn" : "fixOut"), reason: r[half + "_note"] || "", who: r[half + "_entered_by"] || "–" }));

const reasonText = reason => TEXT[state.lang]["r_" + reason] || reason || "";
const typeText   = type => t(type === "intern_contract" ? "stTypeIntern" : "stTypeStaff");
const metres     = value => value == null ? "" : Math.round(value) + " m";

/* For "device already used": name the person that device had already recorded. */
function deviceOwner(row) {
  if (row.reason !== "device_already_used") return "";
  const first = state.log.rows.find(r => r.status === "present" && r.device_id === row.device_id && r.window_id === row.window_id);
  const who = first && staffById(first.staff_id);
  return who ? t("deviceOf", { who: who.staff_code + " " + who.full_name }) : "";
}

/* One description of the columns feeds both the table on screen and the CSV file. */
function logColumns(tab, forFile) {
  const L = state.log, details = forFile || L.details;
  const who = [["colCode", r => (staffById(r.staff_id) || {}).staff_code || ""], ["colName", r => (staffById(r.staff_id) || {}).full_name || "", "wrap"]];

  if (tab === "hours") return [["colDate", () => showDate(L.date)], ["colCode", r => r.staff_code || ""], ["colName", r => r.full_name || ""],
    ["colIn", r => shortKL(r.time_in)], ["colInSource", r => sourceText(r.in_source)], ["colOut", r => shortKL(r.time_out)], ["colOutSource", r => sourceText(r.out_source)],

    ["colBackBy", r => r.going_home ? t("xGoneHome") : hhmm(r.planned_back)], ["colBackAt", r => shortKL(r.back_at)],
    ["colAwayMin", r => r.minutes_away ?? ""], ["colLateBackMin", r => r.late_minutes || ""], ["colDayMin", r => r.day_minutes ?? ""],
    ["colOver", r => r.over_limit ? t("xOver") : ""], ["colStatus", r => t("xs_" + r.status)],

  if (tab === "rejected") cols.push(["colReason", r => deviceOwner(r) || reasonText(r.reason), "wrap wide"]);
  // Accepted without being on a selected-staff event's list. The column appears only when it has something to say (always in the file).
  if (tab === "present" && !L.noListed && (forFile || L.rows.some(r => r.status === "present" && r.not_listed))) cols.push(["colList", r => r.not_listed ? t("notListed") : ""]);
  if (details) cols.push(["colDistance", r => metres(r.distance_m), "num"], ["colAccuracy", r => r.gps_accuracy_m == null ? "" : "±" + Math.round(r.gps_accuracy_m) + " m", "num"],
                         ["colDevice", r => forFile ? r.device_id : "…" + r.device_id.slice(-8)]);     // the file keeps the full ID; the screen shows the end, enough to compare
  return cols;
}

function drawLog() {

    field(t("logDate"), h("input", { id: "logDate", type: "date", value: L.date, max: todayKL(), onchange: e => {

      L.followToday = L.date === todayKL(); L.rows = []; L.hours = []; L.shown = LOG_SHOW; leave(); loadLog(); } })),

      h("option", { value: "" }, t("logAllEvents")),

      h("option", { value: "" }, t("logAllSessions")), sessions.map(w => h("option", { value: w.id }, w.label + " " + hhmm(w.start_time) + "–" + hhmm(w.end_time))))),
    h("div", { class: "fixed actions" },
      h("button", { class: "btn", type: "button", id: "logRefresh", onclick: () => loadLog() }, icon("refresh"), t("refresh")),
      // No download while the list is still loading or failed to load: the file would be empty or half full.
      h("button", { class: "btn", type: "button", id: "logDownload", disabled: L.loading || !!L.error, onclick: downloadCsv }, icon("download"), t("logDownload"))));

  const count = L.loading ? { present: "…", absent: "…", rejected: "…", hours: "…", exits: "…" }
              : L.error   ? { present: "–", absent: "–", rejected: "–", hours: "–", exits: "–" }
              : { present: lists.present.length, absent: lists.absent ? lists.absent.length : "–", rejected: lists.rejected.length, hours: showHours ? lists.hours.length : "–",
                  exits: showExits ? lists.exits.length : "–" };
  const seg = h("div", { class: "seg", role: "group", "aria-label": t("logTitle") },
    [["present", "logPresent"], ["absent", "logAbsent"], ["rejected", "logRejected"], showHours && ["hours", "logHours"], showExits && ["exits", "logExits"]].filter(Boolean).map(([tab, key]) =>
      h("button", { type: "button", "aria-pressed": String(L.tab === tab), "data-tab": tab, onclick: () => { L.tab = tab; L.shown = LOG_SHOW; leave(); drawLog(); } }, t(key) + " (" + count[tab] + ")")));

  let body, more = null;
  const rows = lists[L.tab];

/* Save the list that is showing as a file Excel and Google Sheets can open. */
function downloadCsv() {
  const L = state.log;
  if (L.loading || L.error) return;                              // nothing trustworthy to save yet
  const rows = logLists()[L.tab] || [];
  const cols = logColumns(L.tab, true);
  const cell = value => {
    let text = String(value ?? "");
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;              // stop a spreadsheet from running it as a formula
    return '"' + text.replace(/"/g, '""') + '"';
  };
  const lines = [cols.map(([key]) => cell(t(key))).join(","), ...rows.map(r => cols.map(([, get]) => cell(get(r))).join(","))];
  const ev = eventById(L.eventId);
  const name = ["kehadiran", ev ? ev.event_code : "semua", L.date, L.tab].join("_") + ".csv";
  const link = h("a", { href: URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" })), download: name });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

/* ---------- The map in the event editor ------------------------------------
   Leaflet (leaflet.js + leaflet.css, kept next to this page) draws the map.
   The map pictures come from OpenStreetMap, free, with no account or key.
   The place search uses OpenStreetMap's Nominatim, only when Find is pressed.
   The two number boxes stay: the map and the boxes always show the same spot. */
let liveMap = null;                                   // only one event editor is open at a time
function closeMap() {
  if (!liveMap) return;
  const old = liveMap; liveMap = null;
  setTimeout(() => old.remove(), 600);                // let Leaflet finish any zoom movement first: taking the map apart half-way makes it throw an error
}
const PIN_COLOUR = "#0b5d4b";                         // fixed, because the map pictures are always light
const validSpot = (lat, lng) => lat != null && lng != null && lat !== "" && lng !== "" && Math.abs(Number(lat)) <= 90 && Math.abs(Number(lng)) <= 180;   // "no pin" (an event with location off) is not a spot

function mapPicker(lat, lng, rad, pre) {
  if (!window.L) return null;                         // leaflet.js not there: the number boxes still do the job
  const box = h("div", { class: "map", id: pre + "map" });
  const found = h("div", { class: "map-results", id: pre + "found" });
  const query = h("input", { id: pre + "q", type: "search", autocomplete: "off", placeholder: t("mapPlaceholder") });
  let place = () => {};                               // filled in once the map exists

  async function find() {
    const text = query.value.trim();
    if (!text) return;
    found.replaceChildren(h("p", { class: "help" }, t("mapSearching")));
    try {
      const reply = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=" + state.lang + "&q=" + encodeURIComponent(text));
      const places = await reply.json();
      found.replaceChildren(...(places.length
        ? places.map(p => h("button", { class: "btn small", type: "button", onclick: () => { place({ lat: Number(p.lat), lng: Number(p.lon) }, 17); found.replaceChildren(); } }, p.display_name))
        : [h("p", { class: "help" }, t("mapNothing"))]));
    } catch { found.replaceChildren(h("p", { class: "help" }, t("mapSearchFailed"))); }
  }
  query.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); find(); } });   // Enter searches; it must not save the event

  setTimeout(() => {                                  // wait until the box is really on the page, then build the map in it
    if (!box.isConnected) return;
    closeMap();
    const pinned = validSpot(lat.value, lng.value);
    const others = liveEvents().filter(e => validSpot(e.latitude, e.longitude));
    const start = pinned ? [Number(lat.value), Number(lng.value)]
                : others.length ? [others.reduce((sum, e) => sum + e.latitude, 0) / others.length, others.reduce((sum, e) => sum + e.longitude, 0) / others.length]
                : [4.2, 102.0];                       // nothing to go on: show Peninsular Malaysia
    const map = L.map(box, { scrollWheelZoom: false }).setView(start, pinned ? 18 : others.length ? 16 : 6);   // the mouse wheel scrolls the page, not the map

  const name  = h("input", { id: pre + "name", required: true, maxlength: 120, value: s ? s.full_name : "" });
  const email = h("input", { id: pre + "email", type: "email", maxlength: 120, value: s && s.email ? s.email : "" });
  const type  = h("select", { id: pre + "type", value: s ? s.staff_type : "staff" }, h("option", { value: "staff" }, t("stTypeStaff")), h("option", { value: "intern_contract" }, t("stTypeIntern")));
  const active = check(pre + "active", t("stActive"), s ? s.active : true);
  const save = h("button", { class: "btn primary", type: "submit" }, t("save"));
  return h("form", { class: "form", novalidate: true, onsubmit: e => {
    e.preventDefault();
    const row = { staff_code: code.value.trim().toUpperCase(), full_name: name.value.trim(), email: email.value.trim() || null, staff_type: type.value, active: active.control.checked };
    if (!row.staff_code || !row.full_name) return toast("bad", t("errTitle"), t("errRequired"));
    if (!CODE_OK.test(row.staff_code)) return toast("bad", t("errTitle"), t("errCode"));
    saving(save, async () => {
      if (s) Object.assign(s, (await api("staff?id=eq." + s.id, { method: "PATCH", body: row })).data[0]);
      else state.staff.push((await api("staff", { method: "POST", body: row })).data[0]);
      state.staff.sort((a, b) => a.full_name.localeCompare(b.full_name));
    });
  } },
    h("div", { class: "row" }, field(t("stCode"), code), field(t("stName"), name)),
    h("div", { class: "row" }, field(t("stEmail"), email), field(t("stType"), type)),
    active,
    h("div", { class: "actions" }, save,
      h("button", { class: "btn", type: "button", onclick: () => { state.edit = null; state.confirm = null; drawStaff(); } }, t("cancel")),
      s && h("span", { class: "push" }, removeButton("staff-" + s.id, async () => {
        try { await api("staff?id=eq." + s.id, { method: "DELETE" }); }
        catch (error) {
          if (error.code !== "23503") throw error;
          // Attendance rows point at this person, so the row must stay. Inactive is the staff "archive".
          Object.assign(s, (await api("staff?id=eq." + s.id, { method: "PATCH", body: { active: false } })).data[0]);
          return { message: [t("okInactive"), t("okInactiveText")] };
        }
        state.staff = state.staff.filter(x => x.id !== s.id);
      }))));
}


/* ---------- 13. Settings ------------------------------------------------ */
const LEVELS = ["owner", "manager", "operator"];
const levelName = role => t({ owner: "levelOwner", manager: "levelManager", operator: "levelOperator" }[role] || "levelOperator");
const levelSelect = (id, value, onchange) => h("select", { id, value, onchange }, LEVELS.map(r => h("option", { value: r }, levelName(r))));

function drawSettings() {
  if (!state.session) return;
  const copyRow = (id, label, url) => h("div", null, h("label", { for: id }, label),
    h("div", { class: "tools" },
      h("div", null, h("input", { id, readonly: true, value: url, onfocus: e => e.target.select() })),
      h("div", { class: "fixed" }, h("button", { class: "btn", type: "button", onclick: async () => {
        try { await navigator.clipboard.writeText(url); toast("ok", t("copied")); } catch { $("#" + id).focus(); $("#" + id).select(); }
      } }, t("setCopy")))));

  fillView("settings",
    h("div", { class: "head" }, h("h1", null, t("setTitle"))),
    isOwner() && settingsForm(),
    h("div", { class: "card form", style: "max-width:760px" },
      copyRow("setLink", t("setStaffLink"), STAFF_PAGE),
      state.canPair && copyRow("setDisplay", t("setDisplayLink"), DISPLAY_PAGE)),
    h("div", { class: "card form", style: "max-width:760px" },
      h("h2", null, t("setAccount")),
      h("p", null, t("setSignedIn", { email: state.session.email })),
      h("p", { id: "setLevel" }, t("setLevel", { level: levelName(state.role) }) + " " + t({ owner: "levelOwnerHelp", manager: "levelManagerHelp", operator: "levelOperatorHelp" }[state.role])),
      !isOwner() && h("p", { class: "mute small" }, t("setAdmins"))),
    isOwner() && adminsCard(),
    isOwner() && activityCard());
  if (isOwner()) { paintAdmins(); loadAdmins(); paintActivity(); }
}

function settingsForm() {
  const S = state.settings || {};
  const org = h("input", { id: "setOrg", required: true, maxlength: 120, value: S.organization_name || "" });
  const acc = h("input", { id: "setAcc", type: "number", min: 1, step: 1, required: true, inputmode: "numeric", value: S.max_gps_accuracy_m ?? 30 });
  const sec = h("input", { id: "setSec", type: "number", min: 10, max: 600, step: 1, required: true, inputmode: "numeric", value: S.qr_valid_seconds ?? 60 });
  const save = h("button", { class: "btn primary", type: "submit" }, t("save"));
  return h("form", { class: "card form", id: "setForm", novalidate: true, style: "max-width:760px", onsubmit: e => {
    e.preventDefault();
    const row = { organization_name: org.value.trim(), max_gps_accuracy_m: Math.round(Number(acc.value)), qr_valid_seconds: Math.round(Number(sec.value)) };
    if (!row.organization_name) return toast("bad", t("errTitle"), t("errRequired"));
    if (!(row.max_gps_accuracy_m > 0 && row.qr_valid_seconds >= 10 && row.qr_valid_seconds <= 600)) return toast("bad", t("errTitle"), t("errSettings"));
    saving(save, async () => { state.settings = (await api("org_settings?id=eq.1", { method: "PATCH", body: row })).data[0]; });
  } },
    field(t("setOrg"), org),
    h("div", { class: "row" }, field(t("setAccuracy"), acc, t("setAccuracyHelp")), field(t("setQrSeconds"), sec, t("setQrSecondsHelp"))),
    h("div", { class: "actions" }, save));
}

/* --- Admins (owner only) ---
   The account itself is created in Supabase. Here the owner says "this account is an admin, at this level". */
function adminsCard() {
  const email = h("input", { id: "admEmail", type: "email", autocomplete: "off", spellcheck: "false" });
  const level = levelSelect("admLevel", "operator");
  return h("div", { class: "card form", id: "admBox", style: "max-width:760px" },
    h("h2", null, t("admTitle")),
    h("div", { id: "admList", class: "windows" }),
    h("form", { class: "form", novalidate: true, onsubmit: async e => {
      e.preventDefault();
      if (!email.value.trim()) return toast("bad", t("errTitle"), t("errRequired"));
      if (await setAdmin(email.value.trim(), level.value)) email.value = "";
    } },
      h("p", { class: "help" }, t("admHelp")),
      h("div", { class: "row" }, field(t("admEmail"), email), field(t("admLevel"), level)),
      h("div", { class: "actions" }, h("button", { class: "btn primary", type: "submit" }, icon("plus"), t("admAdd")))));
}

const adminReason = reason => ({ text: t({ no_such_user: "errNoUser", last_owner: "errLastOwner", unconfirmed: "errUnconfirmed" }[reason] || "errNotAllowed") });

async function setAdmin(email, role) {
  let done = false;
  try {
    const { data } = await api("rpc/admin_set", { method: "POST", body: { p_email: email, p_role: role } });
    if (!data.ok) throw adminReason(data.reason);
    toast("ok", t("okSaved")); done = true;
  } catch (error) { fail(error); }
  await afterAdminChange();
  return done;
}

/* An owner may have just changed their own level, so ask the database again who we are. */
async function afterAdminChange() {
  try {
    const role = await fetchRole();
    if (!role) { endSession(); return; }
    if (role !== state.role) { state.role = role; await enterApp(); return; }
  } catch { /* keep what we have */ }
  await loadAdmins();
}

async function loadAdmins() {
  try { state.admins = (await api("rpc/admin_list", { method: "POST", body: {} })).data; }
  catch (error) { if (error.kind !== "session") fail(error); return; }
  paintAdmins();
}

function paintAdmins() {
  const box = $("#admList");
  if (!box) return;
  box.replaceChildren(...state.admins.map(a => h("div", { class: "window", "data-email": a.email },
    h("div", null, h("strong", null, a.email), a.is_me && h("span", { class: "mute small" }, " (" + t("admYou") + ")")),
    h("div", { class: "fixed", style: "min-width:140px" },
      h("label", { class: "sr-only", for: "lvl-" + a.user_id }, t("admLevel")),
      levelSelect("lvl-" + a.user_id, a.role, e => setAdmin(a.email, e.target.value))),
    !a.is_me && removeButton("admin-" + a.user_id, async () => {        // nobody removes themselves by a slip of the finger
      const { data } = await api("rpc/admin_remove", { method: "POST", body: { p_user_id: a.user_id } });
      if (!data.ok) throw adminReason(data.reason);
      state.admins = state.admins.filter(x => x.user_id !== a.user_id);
    }))));
}

/* --- Activity record (owner only) --- */
function activityCard() {
  return h("div", { class: "card form", id: "actBox" },
    h("h2", null, t("actTitle")),
    h("p", { class: "mute small" }, t("actHelp")),
    h("div", { class: "actions" }, h("button", { class: "btn", type: "button", id: "actLoad", onclick: async () => {
      try { state.activity = (await api("admin_audit?select=id,at,actor_email,action,target,summary,detail&order=id.desc&limit=50")).data; }
      catch (error) { fail(error); return; }
      paintActivity();
    } }, icon("refresh"), t("actLoad"))),
    h("div", { id: "actList" }));
}

function activityLine(row) {
  const d = row.detail || {};
  let action = row.action, changes = "";
  if (action === "update") {
    if (d.archived_at) action = d.archived_at[1] ? "archive" : "restore";
    const plain = value => value === null ? "–" : typeof value === "object" ? JSON.stringify(value) : String(value);
    changes = Object.entries(d).filter(([key]) => key !== "archived_at").map(([key, [before, after]]) => key + ": " + plain(before) + " → " + plain(after)).join("; ");
  }
  return [t("act_" + action), t("tg_" + row.target), row.summary || "", changes && "(" + changes + ")"].filter(Boolean).join(" ");
}

function paintActivity() {
  const box = $("#actList");
  if (!box || !state.activity) return;
  box.replaceChildren(!state.activity.length ? h("div", { class: "empty" }, t("actEmpty")) :
    h("div", { class: "tablewrap" }, h("table", { class: "stack" },
      h("thead", null, h("tr", null, h("th", null, t("colWhen")), h("th", null, t("colWho")), h("th", null, t("colWhat")))),
      h("tbody", null, state.activity.map(row => h("tr", null,
        h("td", { class: "inline" }, dateKL(row.at).slice(0, 5) + " " + clockKL(row.at).slice(0, 5)),
        h("td", { class: "inline code" }, row.actor_email || t("actSql")),
        h("td", { class: "wrap wide" }, activityLine(row))))))));
}


/* ---------- 14. Language, and start ------------------------------------ */
function drawLanguage() {
  document.documentElement.lang = state.lang;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  drawMenu();
  if (state.session && state.settings) redraw();
}

$("#loginForm").addEventListener("submit", signIn);
$("#logoutOld").addEventListener("click", () => endSession());
$("#toastClose").addEventListener("click", hideToast);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !toastEl.hidden) hideToast(); });
document.addEventListener("fullscreenchange", () => { const b = $("#qrFull"); if (b) b.lastChild.textContent = t(document.fullscreenElement ? "qrFullExit" : "qrFull"); });
window.addEventListener("hashchange", () => { if (state.session && state.settings) showView(viewFromHash()); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  state.lang = b.dataset.lang; store("local", "lang", state.lang); drawLanguage();
}));

(async function start() {
  drawLanguage();
  let saved = null;
  try { saved = JSON.parse(store("session", "admin_session")); } catch { /* nothing saved */ }
  if (!saved || !saved.refresh_token) { showLogin(); return; }
  const seen = Number(store("session", "admin_active"));
  if (seen && Date.now() - seen >= IDLE_MS) {                     // the tab was left alone too long before this reload
    setSession(saved); endSession("errIdle", { n: IDLE_MINUTES }); return;
  }
  setSession(saved);                                              // same tab was reloaded: carry on without asking for the password
  try {
    if (saved.expires_at * 1000 < Date.now() + 60000) {
      const renewed = await renewSession();
      if (renewed === "ended") return;                            // renewSession has already shown the login screen and said why
      if (renewed !== "ok") { state.epoch++; setSession(null); showLogin(); toast("bad", t("errTitle"), t("errNetwork")); return; }
    }
    state.role = await fetchRole();
    if (!state.role) { dropSession(); showLogin(); return; }
    await enterApp();
  } catch { if (state.session) { state.epoch++; setSession(null); } showLogin(); }
})();
</script>
</body>
</html>
