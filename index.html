<script>
/* LIGHT OR DARK, decided here, before anything is drawn (so the page never flashes the wrong one).
   1. If this device chose one with the sun / moon button, use that choice.
   2. Otherwise the page chooses by itself (themeAuto, below):
        07:00 to 19:00 Malaysian time  -> light. The page is read outdoors, at an entrance, in sunlight,
                                          where a dark page cannot be read.
        at night                       -> whatever the device prefers.
   To go back to "always follow the device", delete the one line that starts with: if (hour >= 7
   The colours themselves are in the <style> block below. The button is drawn by menu.js. */
window.themeAuto = function () {
  var hour = 12;
  try { hour = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kuala_Lumpur", hour: "2-digit", hourCycle: "h23" }).format(new Date())); } catch (e) { /* very old browser: treat it as daytime */ }
  if (hour >= 7 && hour < 19) return "light";
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
};
(function () {
  var chosen = null;
  try { chosen = localStorage.getItem("theme"); } catch (e) { /* storage blocked: the page chooses by itself */ }
  document.documentElement.dataset.theme = chosen === "dark" || chosen === "light" ? chosen : themeAuto();
})();
</script>
<title>Staff Attendance</title>
<!-- The school logo. Two picture files sit next to this page:
     logo.png             see-through background: browser tab + page header
     apple-touch-icon.png white background: iPhone home-screen icon
                          (iPhones paint see-through areas black, so it needs its own) -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ---------- colours: light first, then the same names again for dark ---------- */
:root{
  color-scheme:light;
  --bg:#f2f7f5; --card:#fff; --ink:#14302a; --mute:#566b64; --line:#c9d8d2;
  --brand:#0b5d4b; --on-brand:#fff;
  --ok:#0b6b3a;   --ok-bg:#e3f4ea;
  --bad:#a3231b;  --bad-bg:#fbe9e7;
  --warn:#7a5200; --warn-bg:#fff3d6;
  --shadow:0 1px 2px rgb(20 48 42 / .10), 0 8px 14px -6px rgb(20 48 42 / .30);
}
/* Dark is switched on by <html data-theme="dark">. The script at the top of <head> sets it before
   anything is drawn; the sun / moon button beside the menu (menu.js) changes it. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1a17; --card:#16251f; --ink:#e6f0ec; --mute:#9db3aa; --line:#2b3f37;
  --brand:#3fb594; --on-brand:#04251c;
  --ok:#7be0a8;   --ok-bg:#143325;
  --bad:#ff9d94;  --bad-bg:#3a1b18;
  --warn:#f0c46a; --warn-bg:#3a2d0c;
  --shadow:0 1px 2px rgb(0 0 0 / .40), 0 8px 14px -6px rgb(0 0 0 / .65);
}

/* ---------- page frame ---------- */
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; min-height:100dvh; padding:16px;
  background:var(--bg); color:var(--ink);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid; place-items:start center;
  caret-color:var(--brand); accent-color:var(--brand);
}
::selection{background:var(--brand); color:var(--on-brand)}
.sr-only{position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.shell{width:100%; max-width:520px; display:grid; gap:20px}

/* ---------- header: logo, school name, BM/EN button, title, steps ---------- */
.top{display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1; text-decoration:none; border-radius:8px}
.brand:hover .school{color:var(--ink); text-decoration:underline; text-underline-offset:3px}
.brand:focus-visible{outline:3px solid var(--brand); outline-offset:3px}
.logo{flex:none; width:44px; height:44px; object-fit:contain}
.school{margin:0; color:var(--mute); font-size:.9rem; line-height:1.3; min-width:0}
.titlebar{display:flex; align-items:center; gap:12px; margin-top:.5rem}
h1{margin:0; flex:1; min-width:0; font-size:1.7rem; line-height:1.15; letter-spacing:-.01em}
.steps{display:none; margin:1.2rem 0 0; padding-left:1.2rem; color:var(--mute)}
.steps li{margin:.35rem 0}

.lang{display:flex; flex:none; border:1.5px solid var(--line); border-radius:10px; overflow:hidden}
.lang button{
  font:inherit; font-size:.85rem; font-weight:700; letter-spacing:.03em;
  min-width:44px; min-height:40px; padding:0 .6rem;
  border:0; background:transparent; color:var(--mute); cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--brand); color:var(--on-brand)}

/* ---------- the form card ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px}
.field{margin-bottom:1rem}
label{display:block; font-weight:600; margin:0 0 .35rem}
input,select{
  width:100%; font:inherit; padding:.8rem .9rem; min-height:52px;
  border:1.5px solid var(--line); border-radius:10px;
  background:var(--bg); color:var(--ink);
}
input{text-transform:uppercase}
input::placeholder{text-transform:none; color:var(--mute); opacity:1}     /* the example in the empty staff code box */
select{text-overflow:ellipsis}
select:user-invalid,input:user-invalid{border-color:var(--bad)}
.locked{margin:0; padding:.8rem .9rem; border:1.5px dashed var(--line); border-radius:10px}
.locked small{display:block; color:var(--mute); font-size:.85rem}
.locked strong{overflow-wrap:anywhere}
.hint{margin:.45rem 0 0; font-size:.9rem; color:var(--warn)}

.primary{
  width:100%; min-height:56px; padding:1rem;
  font:inherit; font-weight:700;
  border:0; border-radius:12px; background:var(--brand); color:var(--on-brand); cursor:pointer;
}
.primary[disabled]{opacity:.65; cursor:progress}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--brand); outline-offset:2px}
/* the counter under the button: the same line the big screen shows, e.g. "Petang: 4 of 70 submitted" */
.count{margin:.8rem 0 0; color:var(--mute); font-size:.95rem; text-align:center; overflow-wrap:anywhere}
.count b{color:var(--ink); font-size:1.15em; font-variant-numeric:tabular-nums}
/* the location line above the button: what the phone's GPS is doing right now (drawLoc() fills it in).
   The colour is only a helper: the words always say the same thing. */
.gps{
  display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:.35rem .6rem;
  min-height:2.9em; margin:0 0 .8rem; color:var(--mute); font-size:.9rem; line-height:1.4; text-align:center;
}
.gps[data-state="ready"]{color:var(--ok)}
.gps[data-state="weak"],.gps[data-state="approx"],.gps[data-state="timeout"],.gps[data-state="off"]{color:var(--warn)}
.gps[data-state="denied"],.gps[data-state="unsupported"]{color:var(--bad)}
.gps-line{display:flex; align-items:flex-start; gap:.45rem; min-width:0}       /* the dot stays beside the first line of the words */
.gps-text{min-width:0; overflow-wrap:anywhere}
.gps-dot{flex:none; width:.6em; height:.6em; margin-top:.42em; border-radius:50%; background:currentColor}
.gps button{
  font:inherit; font-weight:700; min-height:44px; padding:0 .9rem;
  border:1.5px solid currentColor; border-radius:10px; background:transparent; color:inherit; cursor:pointer;
}
.gps button:focus-visible{outline-color:currentColor}

/* ---------- the floating notification (green / amber / red) ----------
   It sits on top of the page at the top-left and never pushes the form.
   It stays until the person closes it or submits again.               */
.toast{
  position:fixed; z-index:10;
  inset:auto; top:max(12px, env(safe-area-inset-top)); left:12px; right:12px;
  margin:0; width:auto; height:auto; overflow:visible;
  display:grid; grid-template-columns:auto 1fr auto; gap:.7rem; align-items:start;
  padding:.8rem .35rem .8rem .9rem;
  border:1.5px solid; border-radius:14px; box-shadow:var(--shadow);
}
.toast svg{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.toast-icon{width:24px; height:24px; margin-top:.1rem}
.toast-body{min-width:0}
.toast-title{margin:0; font-size:1.05rem; font-weight:700; line-height:1.3}
.toast-text{margin:.15rem 0 0; font-size:.95rem; overflow-wrap:anywhere}
.toast-close{
  width:44px; height:44px; margin:-.5rem 0; padding:0;
  display:grid; place-items:center;
  border:0; border-radius:10px; background:transparent; color:inherit; cursor:pointer;
}
.toast-close svg{width:18px; height:18px}
.toast-close:hover{background:color-mix(in srgb, currentColor 12%, transparent)}
.toast-close:focus-visible{outline-color:currentColor}
.ok{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.bad{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}

/* ---------- footer: the way in for admins ---------- */
.foot{text-align:center; font-size:.88rem}
.foot a{display:inline-block; padding:.6rem .9rem; color:var(--mute); text-underline-offset:3px; border-radius:8px}
.foot a:hover{color:var(--ink)}
.foot a:focus-visible{outline:3px solid var(--brand); outline-offset:2px}

/* ---------- tablet ---------- */
@media (min-width:640px){
  body{font-size:18px; padding:40px; place-items:center}
  .steps{display:block}
  .card{padding:32px}
  h1{font-size:2rem}
  .toast{top:24px; left:24px; right:auto; width:min(420px, calc(100vw - 48px))}
}
/* ---------- computer: words on the left, form on the right ---------- */
@media (min-width:1024px){
  .shell{max-width:1040px; grid-template-columns:1fr 480px; gap:64px; align-items:center}
  h1{font-size:2.6rem}
  .steps{font-size:1.05rem}
  .logo{width:56px; height:56px}
  .foot{grid-column:1 / -1}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:drop .32s cubic-bezier(.16,1,.3,1)}
  @keyframes drop{from{opacity:0; transform:translateY(-14px) scale(.97)}}
  .gps[data-state="searching"] .gps-dot{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
}
</style>

/* ---------- 3. Small helpers ------------------------------------------ */
const $ = selector => document.querySelector(selector);

/* Swap {name} style placeholders for real values. */
function fill(template, values) {
  return template.replace(/\{(\w+)\}/g, (_, key) => (values && key in values ? values[key] : ""));
}

/* Browser storage can be blocked (private mode), so never let it crash the page. */
function remember(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch { /* storage unavailable: carry on without it */ }
  return null;
}

/* The same, but only for this tab: it is gone when the tab is closed. */
function rememberForTab(key, value) {
  try {
    if (value === undefined) return sessionStorage.getItem(key);
    sessionStorage.setItem(key, value);
  } catch { /* storage unavailable: carry on without it */ }
  return null;
}

/* One random ID per browser. This is what "one device, one person" is checked against. */
function deviceId() {
  let id = remember("device_id");
  if (!id) {
    const raw = crypto.randomUUID
      ? crypto.randomUUID().replace(/-/g, "")
      : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    id = "DEV-" + raw.slice(0, 16).toUpperCase();
    remember("device_id", id);
  }
  return id;
}

/* Knock on one of the database doors. Throws {http: status} or a network error. */
async function callDatabase(functionName, body) {
  const response = await fetch(API + "/rest/v1/rpc/" + functionName, {
    method: "POST",
    headers: { apikey: KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
    signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined
  });
  if (!response.ok) throw { http: response.status };
  return response.json();
}


/* ---------- 4. What the page currently knows -------------------------- */
const query    = new URLSearchParams(location.search);
const urlEvent = (query.get("e") || "").trim();   // set when staff scanned a QR

/* The rotating secret from the QR. It arrives after "#" (…?e=CODE#t=SECRET). That part of a link
   is never sent to a web server, so it cannot land in a server log. ("?t=" is still read, for a QR
   drawn by an older copy of the admin or display page.)
   The secret is then wiped from the address bar, so it is not left in the browsing history and is
   not passed on when someone shares the link. It is kept for this tab only, so that reloading the
   page (for example after allowing location access) does not force a second scan.               */
let qrToken = null;
function takeToken() {
  const found = new URLSearchParams(location.hash.slice(1)).get("t") || query.get("t");
  if (!found || found === qrToken) return false;
  qrToken = found;
  rememberForTab("qr", JSON.stringify({ e: urlEvent.toLowerCase(), t: qrToken }));
  try { history.replaceState(null, "", location.pathname + (urlEvent ? "?e=" + encodeURIComponent(urlEvent) : "")); } catch { /* the link simply stays as it was */ }
  return true;
}
if (!takeToken() && urlEvent) {
  try { const kept = JSON.parse(rememberForTab("qr")); if (kept && kept.e === urlEvent.toLowerCase()) qrToken = kept.t; } catch { /* nothing kept */ }
}

let lang    = remember("lang") === "ms" ? "ms" : "en";   // English unless this device chose BM before
let events  = null;                               // filled by loadEvents()
let eventsAt = 0;                                 // when the list was last read from the database
let mode    = urlEvent ? "locked" : "loading";    // locked | loading | select | typed
let lastMsg = null;                               // so a result can be re-shown in the other language
let busy    = false;

const t = key => TEXT[lang][key];


/* ---------- 5. Drawing the page --------------------------------------- */

/* The little pictures inside the notification, one per colour. */
const ICONS = {
  ok:   '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.8"/>',
  warn: '<path d="M12 4 21 19.5H3z"/><path d="M12 10v4.5M12 17.2v.1"/>',
  bad:  '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>'
};

/* Newer browsers can lift the notification above everything else on the page.
   Older ones simply keep it pinned with CSS, which looks the same here. */
const toast = $("#toast");
const canLift = "popover" in HTMLElement.prototype;
if (canLift) toast.popover = "manual";

/* showMessage("ok", {...}) shows a notification.  showMessage(null) removes it.
   The form underneath is never hidden or cleared. */
function showMessage(id, values) {
  const sameMessage = lastMsg && id === lastMsg.id && !toast.hidden;   // e.g. only the language changed
  lastMsg = id ? { id, values } : null;

  if (!id) {
    if (canLift && toast.matches(":popover-open")) toast.hidePopover();
    toast.hidden = true;
    $("#announce").textContent = "";
    return;
  }

  const [colour, title, text] = MESSAGES[lang][id] || MESSAGES[lang].unknown;
  toast.className = "toast " + colour;
  $("#toastIcon").innerHTML = ICONS[colour];
  $("#toastTitle").textContent = fill(title, values);
  $("#toastText").textContent  = fill(text, values);
  $("#toastClose").setAttribute("aria-label", t("close"));
  $("#announce").textContent = fill(title, values) + ". " + fill(text, values);

  if (toast.hidden) {
    toast.hidden = false;
    if (canLift) toast.showPopover();
  } else if (!sameMessage) {
    toast.style.animation = "none";      // a different message replaced the old one:
    void toast.offsetWidth;              // play the entrance again so the change is noticed
    toast.style.animation = "";
  }
}

function currentEventCode() {
  if (mode === "locked") return urlEvent;
  if (mode === "typed")  return $("#eventCode").value.trim();
  return $("#event").value;
}

function currentEvent() {
  const code = currentEventCode().toLowerCase();
  return events && code ? events.find(e => e.event_code.toLowerCase() === code) || null : null;
}

function drawEventPicker() {
  $("#lockedBox").hidden   = mode !== "locked";
  $("#selectField").hidden = mode !== "loading" && mode !== "select";
  $("#codeField").hidden   = mode !== "typed";

  if (mode === "locked") {
    const found = currentEvent();
    $("#lockedName").textContent = found ? found.name : urlEvent.toUpperCase();
  }

  if (mode === "loading" || mode === "select") {
    const select  = $("#event");
    const keep    = select.value || remember("event_code") || "";
    const options = [];

    const first = new Option(
      mode === "loading" ? t("loading") : events.length ? t("choose") : t("noEvents"), "");
    first.disabled = true;
    options.push(first);

    for (const ev of events || []) {
      options.push(new Option(ev.open_now ? ev.name : ev.name + " (" + t("closedTag") + ")", ev.event_code));
    }
    select.replaceChildren(...options);
    select.value = options.some(o => o.value === keep) ? keep : "";
    select.disabled = mode === "loading" || !events.length;
  }
  drawHint();
}

function drawHint() {
  const ev = currentEvent();
  let text = "";
  if (mode === "typed")                 text = t("hintTyped");
  else if (ev && ev.require_qr && !qrToken) text = t("hintQr");
  else if (ev && !ev.open_now)          text = t("hintClosed");
  $("#hint").textContent = text;
  $("#hint").hidden = !text;
}

function drawLanguage() {
  document.documentElement.lang = lang;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-t]").forEach(el => { if (!(busy && el.id === "go")) el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach(el => { el.innerHTML = t(el.dataset.tHtml); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#siteLink").title = t("siteTitle");
  $("#staff").placeholder = t("staffExample");
  if (window.SiteMenu) SiteMenu.draw(lang); else $("#foot").hidden = false;     // no menu.js: fall back to the plain link
  drawEventPicker();
  drawCount();
  drawLoc();
  if (lastMsg) showMessage(lastMsg.id, lastMsg.values);
}


/* ---------- 6. Fetch the event list for the dropdown ------------------ */
/* loadEvents()      first load: if it fails, fall back to typing the code.
   loadEvents(true)  a later re-read: if it fails, keep the list we already have.
   Returns true when a fresh list arrived.                                        */
async function loadEvents(again) {
  try {
    const rows = await callDatabase("list_events");
    if (!Array.isArray(rows)) throw new Error("unexpected reply");
    events = rows; eventsAt = Date.now();
    if (mode !== "locked") mode = "select";
  } catch {
    if (again && events) return false;
    events = null;
    if (mode !== "locked") mode = "typed";   // spare tyre: type the code
    drawEventPicker();
    return false;
  }
  drawEventPicker();
  return true;
}


/* ---------- 6b. The counter under the button --------------------------
   Once an event is chosen, ask the database how many people have submitted for its session, and ask
   again every 20 seconds while the page is on screen. The database picks the session and does the
   counting (counter_for() in SQL file 07): the big screen and the admin QR screen show the same number.
   The page never counts anything itself.
   Nothing to show (no event chosen, no session today, no connection, older database): the line is hidden. */
const COUNT_MS = 20000;
let count      = null;      // the last answer: { code, data }
let countTimer = null;
let countRound = 0;         // each request takes a number; only the newest one may change the screen
let countOff   = false;     // the database has no counter door for staff phones (SQL file 08 not run): stop asking

function drawCount() {
  const box  = $("#count");
  const code = currentEventCode().toLowerCase();
  const data = count && count.code === code ? count.data : null;
  if (!data || !data.window_label) { box.hidden = true; box.replaceChildren(); return; }
  const note   = data.window_state === "closed" ? t("winClosed") : data.window_state === "upcoming" ? t("winUpcoming") : "";
  const number = document.createElement("b");
  number.textContent = String(data.present);
  // Words from the database (the session name) go in as text, never as HTML.
  box.replaceChildren(data.window_label + (note ? " (" + note + ")" : "") + ": ", number, " " + fill(t("counted"), { n: data.total }));
  box.hidden = false;
}

async function loadCount() {
  clearTimeout(countTimer);
  const mine = ++countRound;
  // Only for an event from the list or from a scanned QR. Not while a code is being typed by hand
  // (that only happens when the list could not be loaded), and not while the page is out of sight.
  const code = mode === "select" || mode === "locked" ? currentEventCode() : "";
  if (!code || countOff || document.hidden) { drawCount(); return; }
  let answer = null;
  try {
    const data = await callDatabase("event_counter", { p_event_code: code });
    if (data && typeof data === "object") answer = { code: code.toLowerCase(), data };
  } catch (error) {
    // 404: no such door. 401 / 403: the door exists but is for admins only (SQL file 07 without 08).
    if (error && [401, 403, 404].includes(error.http)) countOff = true;
  }
  if (mine !== countRound) return;                    // a newer request is in charge
  count = answer;                                     // no answer: hide the line instead of showing an old number
  drawCount();
  if (!countOff) countTimer = setTimeout(loadCount, COUNT_MS);
}


/* ---------- 7. Where is the phone? -------------------------------------
   The page starts looking as soon as an event is chosen, and keeps looking while it is on screen. So
   the GPS warms up while the person types, and the line above the button says how it is going BEFORE
   Submit is pressed. (Until v2.7 the page searched for 12 hidden seconds after Submit, and every
   failure looked the same.)

   The page only decides how long to WAIT. Whether a position is good enough, and whether it is inside
   the area, is still decided by check_in() in the database.                                          */
const GOOD_M    = 30;       // good enough to send. (The real limit is in the admin Settings and is checked by the database.
                            //   If that limit is ever changed, change this number too: it only saves people a pointless wait.)
const SHARP_M   = 15;       // so good that waiting for a better reading is pointless
const APPROX_M  = 500;      // worse than this is not GPS at all: "approximate location" is on, or a computer is guessing from its internet line
const SETTLE_MS = 5000;     // the first readings are often a rough guess from Wi-Fi: give the GPS this long to take over
const KEEP_MS   = 8000;     // keep the best reading this long before a less exact, newer one may replace it
const FRESH_MS  = 15000;    // a reading older than this is never sent: the phone may have moved since
const WAIT_MS   = 20000;    // the longest the page waits for a first reading
const PRESS_MS  = 8000;     // after Submit, wait at least this long before giving up
const REST_MS   = 120000;   // nobody has touched the page for this long: stop the GPS (it drains the battery)

const loc = {
  watch: null,      // the browser's number for the running search; null = not searching
  since: 0,         // when this search started
  fix: null,        // the reading we would send
  fixAt: 0,         // when it arrived
  problem: null,    // denied | off | timeout | unsupported
  problemAt: 0,
  paused: false,    // stopped by the rest timer: the person must ask again
  done: false,      // attendance was recorded: nothing more to look for
  tick: null, rest: null
};

const locFresh = () => !!loc.fix && Date.now() - loc.fixAt <= FRESH_MS;

function locStart() {
  if (!navigator.geolocation) { loc.problem = "unsupported"; drawLoc(); return; }
  if (loc.watch !== null) return;
  loc.fix = null; loc.problem = null; loc.paused = false; loc.done = false;
  loc.since = Date.now();
  loc.watch = navigator.geolocation.watchPosition(
    position => {
      const now = Date.now();
      if (!loc.fix || position.coords.accuracy <= loc.fix.coords.accuracy || now - loc.fixAt > KEEP_MS) { loc.fix = position; loc.fixAt = now; }
      loc.problem = null;
      drawLoc();
    },
    error => {
      if (error.code === 1) { locStop(); locProblem("denied"); return; }    // the person (or the phone's settings) said no: asking again changes nothing
      if (locFresh()) return;                                              // a passing hiccup: the reading we hold is still good
      locProblem(error.code === 2 ? "off" : "timeout");                    // the search carries on: both can clear by themselves
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: WAIT_MS }
  );
  // Once a second: a reading can go stale, and a search can run out of time, without the browser saying anything.
  loc.tick = setInterval(() => {
    if (!loc.fix && !loc.problem && Date.now() - loc.since >= WAIT_MS) locProblem("timeout");
    drawLoc();
  }, 1000);
  locTouch();
  drawLoc();
}

function locStop() {
  if (loc.watch !== null) navigator.geolocation.clearWatch(loc.watch);
  loc.watch = null; loc.fix = null;
  clearInterval(loc.tick); clearTimeout(loc.rest);
}

function locProblem(kind) {
  if (loc.problem !== kind) loc.problemAt = Date.now();
  loc.problem = kind;
  drawLoc();
}

/* Somebody is using the page: push the "stop the GPS" moment further away. */
function locTouch() {
  clearTimeout(loc.rest);
  if (loc.watch !== null) loc.rest = setTimeout(() => { locStop(); loc.paused = true; drawLoc(); }, REST_MS);
}

/* Search when an event is chosen and the page is on screen. Otherwise leave the GPS alone. */
function locSync() {
  if (!currentEventCode() || document.hidden) { locStop(); loc.problem = null; loc.paused = false; drawLoc(); return; }
  if (loc.watch === null && !loc.done && !loc.paused && loc.problem !== "denied") locStart();
  else drawLoc();
}

/* The button on the location line: start again from nothing. */
function locAgain() {
  locStop(); loc.problem = null; loc.paused = false; loc.done = false;
  locStart();
}

function locState() {
  if (loc.done || !currentEventCode()) return null;                 // nothing to say
  if (loc.problem === "unsupported" || loc.problem === "denied") return loc.problem;
  if (loc.paused) return "paused";
  if (locFresh()) {
    const accuracy = loc.fix.coords.accuracy;
    return accuracy >= APPROX_M ? "approx" : accuracy > GOOD_M ? "weak" : "ready";
  }
  if (loc.problem) return loc.problem;                              // off | timeout
  return loc.watch !== null ? "searching" : null;
}

function drawLoc() {
  const box = $("#gps"), state = locState();
  box.hidden = !state;
  if (!state) return;
  box.dataset.state = state;
  const words = { searching: "locSearching", ready: "locReady", weak: "locWeak", approx: "locApprox", denied: "locDenied",
                  off: "locOff", timeout: "locTimeout", unsupported: "locUnsupported", paused: "locPaused" }[state];
  $("#gpsText").textContent = fill(t(words), { m: loc.fix ? Math.round(loc.fix.coords.accuracy) : "" });
  const button = $("#gpsRetry"), ask = ["denied", "off", "timeout", "paused"].includes(state);
  button.hidden = !ask || busy;
  button.textContent = t(state === "paused" ? "locFind" : "locRetry");
}

/* Submit asks here for a position to send. Usually one is already waiting and this answers at once.
   Otherwise it waits (the line above the button shows the readings coming in) and then either hands
   over the best reading it has, for the database to judge, or says what went wrong: { kind }.      */
function locate() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject({ kind: "unsupported" }); return; }
    // Not searching, or only an old reading left (the page was out of sight, or this is a computer that
    // answers once and then goes quiet): start a new search.
    if (loc.watch === null || (loc.fix && !locFresh())) locAgain();
    locTouch();
    const pressed = Date.now();
    const timer = setInterval(look, 250);
    function end(answer, failed) { clearInterval(timer); failed ? reject(answer) : resolve(answer); }
    function look() {
      const now = Date.now(), fresh = locFresh(), accuracy = fresh ? loc.fix.coords.accuracy : Infinity;
      // Exact enough, or good enough once the GPS has had a few seconds to settle: send it.
      if (accuracy <= SHARP_M || (accuracy <= GOOD_M && now - loc.since >= SETTLE_MS)) return end(loc.fix);
      if (loc.problem === "denied" || loc.problem === "unsupported") return end({ kind: loc.problem }, true);
      const patient = now - pressed >= PRESS_MS;                     // the person has waited long enough since pressing
      // "No location from this device" can pass by itself, so give it a few seconds. If it has already lasted that long, answer at once.
      if (!fresh && loc.problem === "off" && (patient || now - loc.problemAt >= PRESS_MS)) return end({ kind: "off" }, true);
      if (now - loc.since >= WAIT_MS && patient) {
        // Time is up. A rough reading still goes to the database, which answers with the exact reason.
        return fresh ? end(loc.fix) : end({ kind: loc.problem === "off" ? "off" : "timeout" }, true);
      }
    }
    look();
  });
}

/* Tell the database about a check-in that the phone itself stopped (no position at all), so an admin
   can see who was stuck and why. Sent once for each person, event and kind of problem while this page
   is open. It never gets in the person's way: if it fails, nothing is shown.
   An older database has no such door (SQL file 11 not run): stop knocking.                         */
const reported = new Set();
let reportOff  = false;
function reportProblem(kind, staffCode, eventCode) {
  const key = [kind, staffCode, eventCode].join("|").toLowerCase();
  if (reportOff || reported.has(key)) return;
  reported.add(key);
  callDatabase("report_location_problem", { p_staff_code: staffCode, p_event_code: eventCode, p_kind: kind, p_device_id: deviceId() })
    .catch(error => { if (error && [401, 403, 404].includes(error.http)) reportOff = true; });
}


/* ---------- 8. The Submit button -------------------------------------- */
async function submit(event) {
  event.preventDefault();
  if (busy) return;

  const staffCode = $("#staff").value.trim().toUpperCase();
  const eventCode = currentEventCode();

  // 8a. Simple checks before we bother the GPS or the database.
  if (!eventCode) {
    showMessage(mode === "typed" ? "need_event_code" : "need_event");
    (mode === "typed" ? $("#eventCode") : $("#event")).focus();
    return;
  }
  if (!staffCode) { showMessage("need_staff"); $("#staff").focus(); return; }

  if (mode === "select") remember("event_code", eventCode);          // the event is remembered; the staff code is not (see section 9)
  showMessage(null);

  const button = $("#go");
  busy = true; button.disabled = true;

  try {
    // 8a-2. "This event needs the QR": the list on this page may be old. An admin may have switched
    //       "Require QR" off since the page was opened. So read the list again BEFORE refusing.
    const chosen = currentEvent();
    if (chosen && chosen.require_qr && !qrToken) {
      button.textContent = t("sending");
      if (!(await loadEvents(true))) { showMessage("network"); return; }
      const now = currentEvent();
      if (now && now.require_qr) { showMessage("qr_needed"); return; }
    }
    button.textContent = t("locating");

    drawLoc();                                        // the "Try again" button rests while Submit is at work

    // 8b. Where is the phone? Usually the answer is already waiting (section 7).
    let position;
    try {
      position = await locate();
    } catch (geoError) {
      const kind = geoError && geoError.kind;
      showMessage({ denied: "geo_denied", unsupported: "geo_unsupported", off: "geo_off" }[kind] || "geo_not_found");
      reportProblem(["denied", "unsupported", "off"].includes(kind) ? kind : "timeout", staffCode, eventCode);
      return;
    }

    // 8c. Send the facts. The database decides.
    button.textContent = t("sending");
    const accuracy = position.coords.accuracy;
    let reply;
    try {
      reply = await callDatabase("check_in", {
        p_staff_code: staffCode,
        p_event_code: eventCode,
        p_lat:        position.coords.latitude,
        p_lng:        position.coords.longitude,
        p_accuracy:   accuracy,
        p_device_id:  deviceId(),
        p_qr_token:   qrToken
      });
    } catch (sendError) {
      if (sendError && sendError.http) showMessage("server", { status: sendError.http });
      else showMessage("network");
      return;
    }

    // 8d. Show the answer. The form stays exactly as it was.
    if (reply && reply.ok) {
      locStop(); loc.done = true;                     // recorded: the GPS can rest, and the location line goes away
      // Accepted. If the database says "late" (after the session's late time), say so: it is recorded, but stamped.
      if (reply.late) showMessage("ok_late", { name: reply.name, event: reply.event, min: reply.late_minutes, after: reply.late_after });
      else showMessage("ok", { name: reply.name, event: reply.event, m: reply.distance_m });
    } else {
      // "detail" is the more exact reason, when the database gives one (for example which kind of duplicate).
      let reason = reply && (reply.detail in MESSAGES[lang] ? reply.detail : reply.reason);
      const metres = reason === "gps_accuracy_too_low" ? accuracy : reply && reply.distance_m;
      // "Too weak" at hundreds of metres is not a weak signal: the device is not using GPS at all. Say what to switch on.
      if (reason === "gps_accuracy_too_low" && accuracy >= APPROX_M) reason = "geo_approx";
      showMessage(reason in MESSAGES[lang] ? reason : "unknown", { m: Math.round(metres || 0) });
    }
  } finally {
    busy = false; button.disabled = false; button.textContent = t("submit");
    drawLoc();
    loadCount();                                      // the number has probably just changed: show it straight away
  }
}


/* ---------- 9. Start --------------------------------------------------- */
// The staff code box starts empty every time, so the example is visible and a borrowed phone never
// shows the last person's code. (Up to v2.6 the code was remembered on the phone: wipe that old copy.)
try { localStorage.removeItem("staff_code"); } catch { /* storage blocked: there was nothing to wipe */ }
$("#f").addEventListener("submit", submit);
$("#event").addEventListener("change", () => { showMessage(null); drawHint(); loadCount(); loc.done = false; locSync(); });   // new choice: clear the old answer, fetch its counter, start looking for the phone
$("#eventCode").addEventListener("change", () => { loc.done = false; locSync(); });   // the spare tyre (code typed by hand): start looking once the code is in
$("#staff").addEventListener("input", locTouch);                                      // typing counts as using the page: keep the GPS awake
$("#gpsRetry").addEventListener("click", locAgain);
// A second scan of the same event can land in this same tab. Only the part after "#" differs then,
// so the browser does not reload the page: pick the new secret up here.
window.addEventListener("hashchange", () => { if (takeToken()) { showMessage(null); drawHint(); } });
// Coming back to a page that was left open: read the event list again if it is more than a minute old,
// so "closed now" and "needs the QR" are not yesterday's news. Not while the list is open under a finger.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !busy && eventsAt && Date.now() - eventsAt > 60000 && document.activeElement !== $("#event")) loadEvents(true);
  if (!document.hidden) loadCount();                  // the counter rests while the page is out of sight, and starts again here
  if (!busy) locSync();                               // so does the GPS: off while the page is out of sight, searching again on return
});
$("#toastClose").addEventListener("click", () => showMessage(null));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !toast.hidden) showMessage(null); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  remember("lang", lang);
  drawLanguage();
}));

drawLanguage();
loadEvents().then(() => { loadCount(); locSync(); });  // the event remembered from last time gets its counter at once, and the search for the phone starts
</script>
</body>
</html>
