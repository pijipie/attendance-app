/* ---------- colours (light), then the same names again for dark ---------- */
:root{
  color-scheme:light dark;
  --bg:#f2f7f5; --card:#fff; --ink:#14302a; --mute:#566b64; --line:#c9d8d2;
  --brand:#0b5d4b; --on-brand:#fff;
  --ok:#0b6b3a;   --ok-bg:#e3f4ea;
  --bad:#a3231b;  --bad-bg:#fbe9e7;
  --warn:#7a5200; --warn-bg:#fff3d6;
  --shadow:0 1px 2px rgb(20 48 42 / .10), 0 8px 14px -6px rgb(20 48 42 / .30);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1a17; --card:#16251f; --ink:#e6f0ec; --mute:#9db3aa; --line:#2b3f37;
    --brand:#3fb594; --on-brand:#04251c;
    --ok:#7be0a8;   --ok-bg:#143325;
    --bad:#ff9d94;  --bad-bg:#3a1b18;
    --warn:#f0c46a; --warn-bg:#3a2d0c;
    --shadow:0 1px 2px rgb(0 0 0 / .40), 0 8px 14px -6px rgb(0 0 0 / .65);
  }
}

/* ---------- page frame ---------- */
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; min-height:100dvh; padding:16px;
  background:var(--bg); color:var(--ink);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid; place-items:start center;
  caret-color:var(--brand); accent-color:var(--brand);
}
::selection{background:var(--brand); color:var(--on-brand)}
.sr-only{position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.shell{width:100%; max-width:520px; display:grid; gap:20px}

/* ---------- header: logo, school name, BM/EN button, title, steps ---------- */
.top{display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1; text-decoration:none; border-radius:8px}
.brand:hover .school{color:var(--ink); text-decoration:underline; text-underline-offset:3px}
.brand:focus-visible{outline:3px solid var(--brand); outline-offset:3px}
.logo{flex:none; width:44px; height:44px; object-fit:contain}
.school{margin:0; color:var(--mute); font-size:.9rem; line-height:1.3; min-width:0}
h1{margin:.5rem 0 0; font-size:1.7rem; line-height:1.15; letter-spacing:-.01em}
.steps{display:none; margin:1.2rem 0 0; padding-left:1.2rem; color:var(--mute)}
.steps li{margin:.35rem 0}

.lang{display:flex; flex:none; border:1.5px solid var(--line); border-radius:10px; overflow:hidden}
.lang button{
  font:inherit; font-size:.85rem; font-weight:700; letter-spacing:.03em;
  min-width:44px; min-height:40px; padding:0 .6rem;
  border:0; background:transparent; color:var(--mute); cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--brand); color:var(--on-brand)}

/* ---------- the form card ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px}
.field{margin-bottom:1rem}
label{display:block; font-weight:600; margin:0 0 .35rem}
input,select{
  width:100%; font:inherit; padding:.8rem .9rem; min-height:52px;
  border:1.5px solid var(--line); border-radius:10px;
  background:var(--bg); color:var(--ink);
}
input{text-transform:uppercase}
select{text-overflow:ellipsis}
select:user-invalid,input:user-invalid{border-color:var(--bad)}
.locked{margin:0; padding:.8rem .9rem; border:1.5px dashed var(--line); border-radius:10px}
.locked small{display:block; color:var(--mute); font-size:.85rem}
.locked strong{overflow-wrap:anywhere}
.hint{margin:.45rem 0 0; font-size:.9rem; color:var(--warn)}

.primary{
  width:100%; min-height:56px; padding:1rem;
  font:inherit; font-weight:700;
  border:0; border-radius:12px; background:var(--brand); color:var(--on-brand); cursor:pointer;
}
.primary[disabled]{opacity:.65; cursor:progress}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--brand); outline-offset:2px}
.gps{min-height:1.5em; margin:.7rem 0 0; color:var(--mute); font-size:.9rem; text-align:center}

/* ---------- the floating notification (green / amber / red) ----------
   It sits on top of the page at the top-left and never pushes the form.
   It stays until the person closes it or submits again.               */
.toast{
  position:fixed; z-index:10;
  inset:auto; top:max(12px, env(safe-area-inset-top)); left:12px; right:12px;
  margin:0; width:auto; height:auto; overflow:visible;
  display:grid; grid-template-columns:auto 1fr auto; gap:.7rem; align-items:start;
  padding:.8rem .35rem .8rem .9rem;
  border:1.5px solid; border-radius:14px; box-shadow:var(--shadow);

.toast svg{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.toast-icon{width:24px; height:24px; margin-top:.1rem}
.toast-body{min-width:0}
.toast-title{margin:0; font-size:1.05rem; font-weight:700; line-height:1.3}
.toast-text{margin:.15rem 0 0; font-size:.95rem; overflow-wrap:anywhere}
.toast-close{
  width:44px; height:44px; margin:-.5rem 0; padding:0;

  border:0; border-radius:10px; background:transparent; color:inherit; cursor:pointer;

.toast-close:hover{background:color-mix(in srgb, currentColor 12%, transparent)}
.toast-close:focus-visible{outline-color:currentColor}

.bad{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.warn{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}

/* ---------- computer: words on the left, form on the right ---------- */
@media (min-width:1024px){

<script>

/* Every result the page can show: [colour, title, explanation].
   The keys in the middle block are the "reason" words sent back by check_in(). */
const MESSAGES = {

    unknown:         ["bad",  "Tidak berjaya", "Sila cuba lagi."]
  },

    qr_invalid_or_expired:            ["warn", "QR code expired", "Scan the QR shown at the location again, then retry."],

    network:         ["bad",  "Connection failed", "Check your internet access and try again."],

};


/* ---------- 3. Small helpers ------------------------------------------ */
const $ = selector => document.querySelector(selector);

/* Swap {name} style placeholders for real values. */
function fill(template, values) {
  return template.replace(/\{(\w+)\}/g, (_, key) => (values && key in values ? values[key] : ""));
}

/* Browser storage can be blocked (private mode), so never let it crash the page. */
function remember(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch { /* storage unavailable: carry on without it */ }
  return null;
}

/* The same, but only for this tab: it is gone when the tab is closed. */
function rememberForTab(key, value) {
  try {
    if (value === undefined) return sessionStorage.getItem(key);
    sessionStorage.setItem(key, value);
  } catch { /* storage unavailable: carry on without it */ }
  return null;
}

/* One random ID per browser. This is what "one device, one person" is checked against. */
function deviceId() {
  let id = remember("device_id");
  if (!id) {
    const raw = crypto.randomUUID
      ? crypto.randomUUID().replace(/-/g, "")
      : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    id = "DEV-" + raw.slice(0, 16).toUpperCase();
    remember("device_id", id);
  }
  return id;
}

/* Knock on one of the database doors. Throws {http: status} or a network error. */
async function callDatabase(functionName, body) {
  const response = await fetch(API + "/rest/v1/rpc/" + functionName, {
    method: "POST",
    headers: { apikey: KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
    signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined
  });
  if (!response.ok) throw { http: response.status };
  return response.json();
}


/* ---------- 4. What the page currently knows -------------------------- */
const query    = new URLSearchParams(location.search);
const urlEvent = (query.get("e") || "").trim();   // set when staff scanned a QR

/* The rotating secret from the QR. It arrives after "#" (…?e=CODE#t=SECRET). That part of a link
   is never sent to a web server, so it cannot land in a server log. ("?t=" is still read, for a QR
   drawn by an older copy of the admin or display page.)
   The secret is then wiped from the address bar, so it is not left in the browsing history and is
   not passed on when someone shares the link. It is kept for this tab only, so that reloading the
   page (for example after allowing location access) does not force a second scan.               */
let qrToken = null;
function takeToken() {
  const found = new URLSearchParams(location.hash.slice(1)).get("t") || query.get("t");
  if (!found || found === qrToken) return false;
  qrToken = found;
  rememberForTab("qr", JSON.stringify({ e: urlEvent.toLowerCase(), t: qrToken }));
  try { history.replaceState(null, "", location.pathname + (urlEvent ? "?e=" + encodeURIComponent(urlEvent) : "")); } catch { /* the link simply stays as it was */ }
  return true;
}
if (!takeToken() && urlEvent) {
  try { const kept = JSON.parse(rememberForTab("qr")); if (kept && kept.e === urlEvent.toLowerCase()) qrToken = kept.t; } catch { /* nothing kept */ }
}

let lang    = remember("lang") === "ms" ? "ms" : "en";   // English unless this device chose BM before
let events  = null;                               // filled by loadEvents()
let eventsAt = 0;                                 // when the list was last read from the database
let mode    = urlEvent ? "locked" : "loading";    // locked | loading | select | typed
let lastMsg = null;                               // so a result can be re-shown in the other language
let busy    = false;

const t = key => TEXT[lang][key];


/* ---------- 5. Drawing the page --------------------------------------- */

/* The little pictures inside the notification, one per colour. */
const ICONS = {
  ok:   '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.8"/>',
  warn: '<path d="M12 4 21 19.5H3z"/><path d="M12 10v4.5M12 17.2v.1"/>',
  bad:  '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>'
};

/* Newer browsers can lift the notification above everything else on the page.
   Older ones simply keep it pinned with CSS, which looks the same here. */
const toast = $("#toast");
const canLift = "popover" in HTMLElement.prototype;
if (canLift) toast.popover = "manual";

/* showMessage("ok", {...}) shows a notification.  showMessage(null) removes it.
   The form underneath is never hidden or cleared. */
function showMessage(id, values) {
  const sameMessage = lastMsg && id === lastMsg.id && !toast.hidden;   // e.g. only the language changed
  lastMsg = id ? { id, values } : null;

  if (!id) {
    if (canLift && toast.matches(":popover-open")) toast.hidePopover();
    toast.hidden = true;
    $("#announce").textContent = "";
    return;
  }

  const [colour, title, text] = MESSAGES[lang][id] || MESSAGES[lang].unknown;
  toast.className = "toast " + colour;
  $("#toastIcon").innerHTML = ICONS[colour];
  $("#toastTitle").textContent = fill(title, values);
  $("#toastText").textContent  = fill(text, values);
  $("#toastClose").setAttribute("aria-label", t("close"));
  $("#announce").textContent = fill(title, values) + ". " + fill(text, values);

  if (toast.hidden) {
    toast.hidden = false;
    if (canLift) toast.showPopover();
  } else if (!sameMessage) {
    toast.style.animation = "none";      // a different message replaced the old one:
    void toast.offsetWidth;              // play the entrance again so the change is noticed
    toast.style.animation = "";
  }
}

function currentEventCode() {
  if (mode === "locked") return urlEvent;
  if (mode === "typed")  return $("#eventCode").value.trim();
  return $("#event").value;
}

function currentEvent() {
  const code = currentEventCode().toLowerCase();
  return events && code ? events.find(e => e.event_code.toLowerCase() === code) || null : null;
}

function drawEventPicker() {
  $("#lockedBox").hidden   = mode !== "locked";
  $("#selectField").hidden = mode !== "loading" && mode !== "select";
  $("#codeField").hidden   = mode !== "typed";

  if (mode === "locked") {
    const found = currentEvent();
    $("#lockedName").textContent = found ? found.name : urlEvent.toUpperCase();
  }

  if (mode === "loading" || mode === "select") {
    const select  = $("#event");
    const keep    = select.value || remember("event_code") || "";
    const options = [];

    const first = new Option(
      mode === "loading" ? t("loading") : events.length ? t("choose") : t("noEvents"), "");
    first.disabled = true;
    options.push(first);

    for (const ev of events || []) {
      options.push(new Option(ev.open_now ? ev.name : ev.name + " (" + t("closedTag") + ")", ev.event_code));
    }
    select.replaceChildren(...options);
    select.value = options.some(o => o.value === keep) ? keep : "";
    select.disabled = mode === "loading" || !events.length;
  }
  drawHint();
}

function drawHint() {
  const ev = currentEvent();
  let text = "";
  if (mode === "typed")                 text = t("hintTyped");
  else if (ev && ev.require_qr && !qrToken) text = t("hintQr");
  else if (ev && !ev.open_now)          text = t("hintClosed");
  $("#hint").textContent = text;
  $("#hint").hidden = !text;
}

function drawLanguage() {
  document.documentElement.lang = lang;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-t]").forEach(el => { if (!(busy && el.id === "go")) el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach(el => { el.innerHTML = t(el.dataset.tHtml); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#siteLink").title = t("siteTitle");
  if (window.SiteMenu) SiteMenu.draw(lang); else $("#foot").hidden = false;     // no menu.js: fall back to the plain link
  drawEventPicker();
  if (lastMsg) showMessage(lastMsg.id, lastMsg.values);
}


/* ---------- 6. Fetch the event list for the dropdown ------------------ */
/* loadEvents()      first load: if it fails, fall back to typing the code.
   loadEvents(true)  a later re-read: if it fails, keep the list we already have.
   Returns true when a fresh list arrived.                                        */
async function loadEvents(again) {
  try {
    const rows = await callDatabase("list_events");
    if (!Array.isArray(rows)) throw new Error("unexpected reply");
    events = rows; eventsAt = Date.now();
    if (mode !== "locked") mode = "select";
  } catch {
    if (again && events) return false;
    events = null;
    if (mode !== "locked") mode = "typed";   // spare tyre: type the code
    drawEventPicker();
    return false;
  }
  drawEventPicker();
  return true;
}


/* ---------- 7. Ask the phone where it is ------------------------------
   Watches the GPS for up to 12 s and keeps the most accurate reading.
   Stops early as soon as accuracy is 15 m or better.                   */
function locate(onReading) {
  return new Promise((resolve, reject) => {
    let best = null, watchId, timer;
    const finish = () => {
      navigator.geolocation.clearWatch(watchId);
      clearTimeout(timer);
      best ? resolve(best) : reject({ code: 3 });
    };
    watchId = navigator.geolocation.watchPosition(
      position => {
        if (!best || position.coords.accuracy < best.coords.accuracy) best = position;
        onReading(position.coords.accuracy);
        if (position.coords.accuracy <= 15) finish();
      },
      error => {
        if (error.code === 1) {            // the person pressed "Block"
          navigator.geolocation.clearWatch(watchId);
          clearTimeout(timer);
          reject(error);
        }
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
    timer = setTimeout(finish, 12000);
  });
}


/* ---------- 8. The Submit button -------------------------------------- */
async function submit(event) {
  event.preventDefault();
  if (busy) return;

  const staffCode = $("#staff").value.trim().toUpperCase();
  const eventCode = currentEventCode();

  // 8a. Simple checks before we bother the GPS or the database.
  if (!eventCode) {
    showMessage(mode === "typed" ? "need_event_code" : "need_event");
    (mode === "typed" ? $("#eventCode") : $("#event")).focus();
    return;
  }
  if (!staffCode) { showMessage("need_staff"); $("#staff").focus(); return; }

  remember("staff_code", staffCode);
  if (mode === "select") remember("event_code", eventCode);
  showMessage(null);

  const button = $("#go");
  busy = true; button.disabled = true;

  try {
    // 8a-2. "This event needs the QR": the list on this page may be old. An admin may have switched
    //       "Require QR" off since the page was opened. So read the list again BEFORE refusing.
    const chosen = currentEvent();
    if (chosen && chosen.require_qr && !qrToken) {
      button.textContent = t("sending");
      if (!(await loadEvents(true))) { showMessage("network"); return; }
      const now = currentEvent();
      if (now && now.require_qr) { showMessage("qr_needed"); return; }
    }
    button.textContent = t("locating");

    // 8b. Where is the phone?
    let position;
    try {
      if (!navigator.geolocation) throw { code: 0 };
      position = await locate(metres => { $("#gps").textContent = fill(t("gps"), { m: Math.round(metres) }); });
    } catch (geoError) {
      const code = geoError && geoError.code;
      showMessage(code === 1 ? "geo_denied" : code === 0 ? "geo_unsupported" : "geo_not_found");
      return;
    }

    // 8c. Send the facts. The database decides.
    button.textContent = t("sending");
    const accuracy = position.coords.accuracy;
    let reply;
    try {
      reply = await callDatabase("check_in", {
        p_staff_code: staffCode,
        p_event_code: eventCode,
        p_lat:        position.coords.latitude,
        p_lng:        position.coords.longitude,
        p_accuracy:   accuracy,
        p_device_id:  deviceId(),
        p_qr_token:   qrToken
      });
    } catch (sendError) {
      if (sendError && sendError.http) showMessage("server", { status: sendError.http });
      else showMessage("network");
      return;
    }

    // 8d. Show the answer. The form stays exactly as it was.
    if (reply && reply.ok) {
      showMessage("ok", { name: reply.name, event: reply.event, m: reply.distance_m });
    } else {
      // "detail" is the more exact reason, when the database gives one (for example which kind of duplicate).
      const reason = reply && (reply.detail in MESSAGES[lang] ? reply.detail : reply.reason);
      const metres = reason === "gps_accuracy_too_low" ? accuracy : reply && reply.distance_m;
      showMessage(reason in MESSAGES[lang] ? reason : "unknown", { m: Math.round(metres || 0) });
    }
  } finally {
    busy = false; button.disabled = false; button.textContent = t("submit");
    $("#gps").textContent = "";
  }
}


/* ---------- 9. Start --------------------------------------------------- */
$("#staff").value = remember("staff_code") || "";
$("#f").addEventListener("submit", submit);
$("#event").addEventListener("change", () => { showMessage(null); drawHint(); });   // new choice: clear the old answer
// A second scan of the same event can land in this same tab. Only the part after "#" differs then,
// so the browser does not reload the page: pick the new secret up here.
window.addEventListener("hashchange", () => { if (takeToken()) { showMessage(null); drawHint(); } });
// Coming back to a page that was left open: read the event list again if it is more than a minute old,
// so "closed now" and "needs the QR" are not yesterday's news. Not while the list is open under a finger.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !busy && eventsAt && Date.now() - eventsAt > 60000 && document.activeElement !== $("#event")) loadEvents(true);
});
$("#toastClose").addEventListener("click", () => showMessage(null));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !toast.hidden) showMessage(null); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  remember("lang", lang);
  drawLanguage();
}));

drawLanguage();
loadEvents();
</script>
